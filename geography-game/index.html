<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ידיעת הארץ 🗺️</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"><\/script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --purple:#6a11cb; --blue:#2575fc; --green:#00b894;
      --orange:#e17055; --pink:#fd79a8; --yellow:#fdcb6e; --red:#ff4757;
    }
    body {
      font-family:'Heebo',Arial,sans-serif;
      background:linear-gradient(135deg,var(--purple) 0%,var(--blue) 100%);
      min-height:100vh; display:flex; flex-direction:column; align-items:center;
    }
    .header {
      width:100%; background:#fff; padding:10px 20px 7px;
      text-align:center; box-shadow:0 4px 20px rgba(0,0,0,.25);
      position:sticky; top:0; z-index:500;
    }
    .header h1 {
      font-size:1.85em; font-weight:900;
      background:linear-gradient(135deg,var(--purple),var(--blue));
      -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
    }
    .hdr-stats { display:flex; justify-content:center; gap:12px; margin-top:6px; flex-wrap:wrap; }
    .stat-badge {
      background:linear-gradient(135deg,#f6d365,#fda085);
      padding:3px 15px; border-radius:20px; font-weight:700; font-size:.88em;
      color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.2);
    }
    .progress-bar { width:100%; height:7px; background:#e2e8f0; }
    .progress-fill {
      height:100%; background:linear-gradient(90deg,var(--purple),var(--pink));
      border-radius:0 4px 4px 0; transition:width .55s ease;
    }
    .card {
      width:95%; max-width:800px; margin:22px auto 40px;
      background:#fff; border-radius:26px; overflow:hidden;
      box-shadow:0 18px 60px rgba(0,0,0,.35);
    }
    /* ── MENU ── */
    #menuScreen { padding:36px 28px; }
    .menu-title { text-align:center; font-size:1.5em; font-weight:900; color:var(--purple); margin-bottom:4px; }
    .menu-sub   { text-align:center; color:#636e72; margin-bottom:24px; font-size:.95em; line-height:1.6; }
    .mode-grid  { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px; margin-bottom:26px; }
    .mode-card  {
      border:3px solid transparent; border-radius:18px; padding:18px 14px;
      text-align:center; cursor:pointer; background:#f8f9ff;
      transition:transform .15s,box-shadow .15s,border-color .15s;
    }
    .mode-card:hover   { transform:translateY(-4px); box-shadow:0 8px 24px rgba(0,0,0,.15); }
    .mode-card.selected{ border-color:var(--purple); background:#f0edff; }
    .mode-card .mode-icon { font-size:2.4em; }
    .mode-card .mode-name { font-size:1.05em; font-weight:700; color:#2d3436; margin-top:6px; }
    .mode-card .mode-desc { font-size:.8em; color:#636e72; margin-top:3px; line-height:1.4; }
    .diff-label { font-weight:700; color:#4a5568; margin-bottom:10px; text-align:center; }
    .diff-pills { display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin-bottom:26px; }
    .diff-pill  {
      padding:7px 20px; border-radius:25px; border:2px solid #c5b9ff;
      font-family:inherit; font-size:.9em; font-weight:700;
      cursor:pointer; transition:.15s; background:#fff; color:var(--purple);
    }
    .diff-pill:hover   { background:#ede8ff; }
    .diff-pill.selected{ background:var(--purple); color:#fff; border-color:var(--purple); }
    .btn-start {
      display:block; width:100%; max-width:300px; margin:0 auto;
      padding:15px; font-size:1.25em; font-weight:900; font-family:inherit;
      border:none; border-radius:50px;
      background:linear-gradient(135deg,var(--purple),var(--blue)); color:#fff;
      cursor:pointer; box-shadow:0 6px 20px rgba(106,17,203,.45);
      transition:transform .15s,box-shadow .15s;
    }
    .btn-start:hover { transform:translateY(-2px); box-shadow:0 10px 28px rgba(106,17,203,.5); }
    /* ── GAME ── */
    .question-banner { background:linear-gradient(135deg,#a29bfe,#fd79a8); padding:13px 20px; text-align:center; }
    .question-text { font-size:1.2em; font-weight:700; color:#fff; text-shadow:0 1px 4px rgba(0,0,0,.25); line-height:1.4; }
    .clue-box {
      background:linear-gradient(135deg,#fff9c4,#fff3e0);
      border-right:5px solid var(--yellow); padding:14px 18px;
      font-size:1em; line-height:1.65; color:#2d3436; display:none;
    }
    .clue-box strong { color:var(--purple); }
    #map { width:100%; height:390px; transition:height .3s; }
    #map.map-small { height:0; overflow:hidden; }
    .answers { display:flex; gap:9px; padding:13px 14px 9px; }
    .answer-btn {
      flex:1; padding:13px 6px; font-size:1.05em; font-weight:700;
      border:none; border-radius:15px; cursor:pointer; font-family:inherit;
      transition:transform .13s,box-shadow .13s; box-shadow:0 4px 12px rgba(0,0,0,.14);
      position:relative; overflow:hidden;
    }
    .answer-btn::after { content:''; position:absolute; inset:0; background:rgba(255,255,255,.18); opacity:0; transition:opacity .2s; }
    .answer-btn:hover:not(:disabled)::after { opacity:1; }
    .answer-btn:hover:not(:disabled) { transform:translateY(-3px); box-shadow:0 8px 20px rgba(0,0,0,.2); }
    .answer-btn:disabled { cursor:not-allowed; }
    .answer-btn.opt-0 { background:linear-gradient(135deg,#f7971e,#ffd200); color:#333; }
    .answer-btn.opt-1 { background:linear-gradient(135deg,#11998e,#38ef7d); color:#fff; }
    .answer-btn.opt-2 { background:linear-gradient(135deg,#ee0979,#ff6a00); color:#fff; }
    .answer-btn.opt-3 { background:linear-gradient(135deg,#4776e6,#8e54e9); color:#fff; }
    .answer-btn.correct { background:linear-gradient(135deg,#0f9b58,#00bf8f)!important; color:#fff!important; box-shadow:0 0 22px rgba(15,155,88,.55)!important; }
    .answer-btn.wrong   { background:linear-gradient(135deg,#cb2d3e,#ef473a)!important; color:#fff!important; opacity:.72; }
    .feedback { min-height:48px; text-align:center; padding:5px 16px 13px; font-size:1.15em; font-weight:700; }
    /* ── INFO CARD ── */
    .overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:600; align-items:flex-end; justify-content:center; padding:20px; }
    .overlay.show { display:flex; }
    .info-card {
      background:#fff; border-radius:22px 22px 18px 18px; width:100%; max-width:600px;
      padding:26px 24px 22px; animation:slideUp .35s ease; max-height:80vh; overflow-y:auto;
    }
    @keyframes slideUp { from{transform:translateY(60px);opacity:0} to{transform:translateY(0);opacity:1} }
    .ic-header  { display:flex; align-items:center; gap:12px; margin-bottom:12px; }
    .ic-icon    { font-size:2.5em; }
    .ic-title   { font-size:1.5em; font-weight:900; color:var(--purple); }
    .ic-type    { font-size:.85em; color:#636e72; }
    .ic-badges  { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
    .ic-badge   { background:#f0edff; color:var(--purple); border-radius:20px; padding:3px 12px; font-size:.82em; font-weight:700; }
    .ic-fact    { background:linear-gradient(135deg,#f0fffe,#e8f5e9); border-right:4px solid var(--green); padding:12px 14px; border-radius:10px; font-size:.95em; line-height:1.7; color:#2d3436; margin-bottom:18px; }
    .btn-next   { display:block; width:100%; padding:13px; font-size:1.1em; font-weight:900; font-family:inherit; border:none; border-radius:40px; background:linear-gradient(135deg,var(--purple),var(--blue)); color:#fff; cursor:pointer; box-shadow:0 4px 16px rgba(106,17,203,.4); transition:transform .13s; }
    .btn-next:hover { transform:translateY(-2px); }
    /* ── RESULTS ── */
    #resultsScreen { text-align:center; padding:52px 28px; }
    .res-emoji { font-size:5.5em; line-height:1; }
    .res-msg   { font-size:1.75em; font-weight:900; margin:14px 0 6px; }
    .res-score { font-size:1.2em; color:#636e72; margin-bottom:8px; }
    .res-stars { font-size:2em; margin-bottom:22px; }
    .res-breakdown { display:flex; justify-content:center; flex-wrap:wrap; gap:10px; margin-bottom:28px; }
    .res-item  { background:#f8f9ff; border-radius:14px; padding:10px 16px; font-size:.9em; text-align:center; }
    .res-item .ri-label { color:#636e72; font-size:.8em; }
    .res-item .ri-val   { font-weight:900; font-size:1.2em; color:var(--purple); }
    /* ── Leaflet marker ── */
    .pulse-wrap { position:relative; width:60px; height:60px; }
    .pulse-dot  { position:absolute; width:22px; height:22px; border-radius:50%; top:50%; left:50%; transform:translate(-50%,-50%); border:3px solid #fff; box-shadow:0 2px 10px rgba(0,0,0,.35); }
    .pulse-ring { position:absolute; width:22px; height:22px; border-radius:50%; top:50%; left:50%; transform:translate(-50%,-50%); border:3px solid; animation:ringOut 1.5s ease-out infinite; }
    @keyframes ringOut { 0%{transform:translate(-50%,-50%) scale(1);opacity:.85} 100%{transform:translate(-50%,-50%) scale(3.6);opacity:0} }
    .leaflet-div-icon { background:none!important; border:none!important; }
    .leaflet-popup-content-wrapper { border-radius:12px!important; font-family:'Heebo',Arial,sans-serif!important; font-weight:700; font-size:1em; box-shadow:0 4px 20px rgba(0,0,0,.25)!important; padding:0!important; }
    .leaflet-popup-content { margin:10px 16px!important; }
    /* ── Animations ── */
    @keyframes floatStar { 0%{transform:translateY(0) scale(1);opacity:1} 100%{transform:translateY(-110px) scale(1.6);opacity:0} }
    .float-star { position:fixed; font-size:2em; pointer-events:none; z-index:999; animation:floatStar 1s ease-out forwards; }
    @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-8px)} 40%{transform:translateX(8px)} 60%{transform:translateX(-5px)} 80%{transform:translateX(5px)} }
    .shake { animation:shake .38s ease; }
    @media(max-width:500px){
      .header h1{font-size:1.4em} #map{height:290px}
      .answer-btn{font-size:.9em;padding:11px 4px} .answers{gap:6px;padding:10px 8px 6px}
      .mode-grid{grid-template-columns:1fr 1fr}
    }
  </style>
</head>
<body>

<div class="header">
  <h1>🗺️ ידיעת הארץ</h1>
  <div class="hdr-stats" id="hdrStats" style="display:none">
    <div class="stat-badge">⭐ ניקוד: <span id="scoreVal">0</span></div>
    <div class="stat-badge">❓ שאלה <span id="qNum">1</span> / <span id="qTot">10</span></div>
    <div class="stat-badge" id="modeBadge"></div>
  </div>
</div>
<div class="progress-bar"><div class="progress-fill" id="progFill" style="width:0%"></div></div>

<div class="card" id="mainCard">

  <!-- MAIN MENU -->
  <div id="menuScreen">
    <div style="text-align:center;font-size:3.5em;margin-bottom:8px">🗺️</div>
    <div class="menu-title">ברוכים הבאים – משחק ידיעת הארץ</div>
    <div class="menu-sub">עיר, נהר, יער או הר יופיעו על מפה, ועליך לנחש את שמם.<br />בחר מצב משחק ורמת קושי ולחץ "התחל"!</div>
    <div class="mode-grid" id="modeGrid">
      <div class="mode-card selected" data-mode="map"  onclick="pickMode(this)"><div class="mode-icon">📍</div><div class="mode-name">מצביע על המפה</div><div class="mode-desc">מיקום מהבהב – נחש מתוך 3 שמות</div></div>
      <div class="mode-card"          data-mode="clue" onclick="pickMode(this)"><div class="mode-icon">💡</div><div class="mode-name">נחש לפי רמז</div><div class="mode-desc">קרא רמז טקסטואלי – נחש מתוך 4 אפשרויות</div></div>
      <div class="mode-card"          data-mode="gk"   onclick="pickMode(this)"><div class="mode-icon">🧠</div><div class="mode-name">ידע כללי</div><div class="mode-desc">שאלות גיאוגרפיה ועובדות מרתקות</div></div>
    </div>
    <div class="diff-label">⚙️ רמת קושי</div>
    <div class="diff-pills" id="diffPills">
      <button class="diff-pill selected" data-diff="1" onclick="pickDiff(this)">⭐ קל</button>
      <button class="diff-pill"          data-diff="2" onclick="pickDiff(this)">⭐⭐ בינוני</button>
      <button class="diff-pill"          data-diff="3" onclick="pickDiff(this)">⭐⭐⭐ קשה</button>
      <button class="diff-pill"          data-diff="4" onclick="pickDiff(this)">⭐⭐⭐⭐ מאסטר</button>
    </div>
    <button class="btn-start" onclick="startGame()">🚀 התחל משחק!</button>
  </div>

  <!-- GAME SCREEN -->
  <div id="gameScreen" style="display:none">
    <div class="question-banner"><div class="question-text" id="questionText"></div></div>
    <div class="clue-box" id="clueBox"></div>
    <div id="map"></div>
    <div class="answers" id="answersDiv"></div>
    <div class="feedback" id="feedback"></div>
  </div>

  <!-- RESULTS SCREEN -->
  <div id="resultsScreen" style="display:none"></div>

</div>

<!-- INFO CARD OVERLAY -->
<div class="overlay" id="infoOverlay">
  <div class="info-card" id="infoCard">
    <div class="ic-header"><div class="ic-icon" id="icIcon"></div><div><div class="ic-title" id="icTitle"></div><div class="ic-type" id="icType"></div></div></div>
    <div class="ic-badges" id="icBadges"></div>
    <div class="ic-fact"   id="icFact"></div>
    <button class="btn-next" onclick="closeInfoCard()">הבא ←</button>
  </div>
</div>

<script>
const TYPE_LABELS = {city:'עיר/יישוב',river:'נהר/נחל',forest:'יער',mountain:'הר/מצוק',lake:'ים/אגם'};
const TYPE_COLORS = {city:'#ff4757',river:'#0984e3',forest:'#00b894',mountain:'#e17055',lake:'#00cec9'};

const LOCATIONS = [
  {id:'tlv', name:'תל אביב-יפו',   type:'city',     diff:1, lat:32.0853,lng:34.7818, region:'גוש דן',        pop:467000, icon:'🏙️', fact:'תל אביב הייתה העיר העברית הראשונה בעולם (1909). כיום מרכז טכנולוגיה, תרבות ועסקים.', clue:'אני העיר שנוסדה ב-1909 כ"גן בעיר" ליד יפו העתיקה.'},
  {id:'jlm', name:'ירושלים',        type:'city',     diff:1, lat:31.7683,lng:35.2137, region:'ירושלים',       pop:936000, icon:'🏛️', fact:'ירושלים בירת ישראל, עיר קדושה לשלוש הדתות. הכותל המערבי ומסגד אל-אקצה נמצאים בה.', clue:'אני בירת ישראל, עיר קדושה לשלוש דתות עם הכותל המערבי.'},
  {id:'hfa', name:'חיפה',            type:'city',     diff:1, lat:32.7940,lng:34.9896, region:'חיפה',          pop:290000, icon:'⚓', fact:'חיפה עיר הנמל הגדולה, שוכנת על הר הכרמל. גני הבהאי המרהיבים נכללים ברשימת אונסקו.', clue:'אני עיר הנמל הצפונית עם גני הבהאי ומפרץ יפהפה.'},
  {id:'bsh', name:'באר שבע',         type:'city',     diff:1, lat:31.2518,lng:34.7915, region:'הנגב',          pop:213000, icon:'🐪', fact:'באר שבע "בירת הנגב", מרכזת תעשייה ואוניברסיטת בן-גוריון. בתנ"ך גבול ישראל הדרומי.', clue:'אני "בירת הנגב", עם אוניברסיטה חשובה, בדרום ישראל.'},
  {id:'asd', name:'אשדוד',           type:'city',     diff:1, lat:31.8044,lng:34.6553, region:'שפלה',          pop:240000, icon:'🚢', fact:'אשדוד בנויה על דיונות חול. כ-70% מהסחורות הנכנסות לישראל עוברות דרך הנמל שלה.', clue:'אני עיר הנמל הגדולה, 70% מסחורות ישראל עוברות בי.'},
  {id:'ntn', name:'נתניה',            type:'city',     diff:1, lat:32.3215,lng:34.8532, region:'שרון',          pop:220000, icon:'🏖️', fact:'נתניה "עיר היהלומים" בשל תעשיית הצחצוח. ידועה בחופיה הנפלאים על הים התיכון.', clue:'אני "עיר היהלומים", עיר חוף יפה בשרון הצפוני.'},
  {id:'r1z', name:'ראשון לציון',     type:'city',     diff:1, lat:31.9642,lng:34.8044, region:'גוש דן',        pop:263000, icon:'🍇', fact:'ראשון לציון (1882) אחת המושבות הציוניות הראשונות. שמה מהפסוק "ראשון לציון הנה הנם".', clue:'אני מושבה ציונית מ-1882, שמי לקוח מפסוק בישעיהו.'},
  {id:'ptk', name:'פתח תקווה',       type:'city',     diff:1, lat:32.0840,lng:34.8878, region:'גוש דן',        pop:260000, icon:'🌾', fact:'פתח תקווה (1878) "אם המושבות" – המושבה הציונית הראשונה בארץ ישראל.', clue:'אני "אם המושבות", המושבה הציונית הראשונה (1878).'},
  {id:'akl', name:'אשקלון',           type:'city',     diff:1, lat:31.6688,lng:34.5743, region:'שפלה דרומית',  pop:148000, icon:'🏺', fact:'אשקלון אחת הערים הקדומות בעולם. פארק לאומי בה עם שרידי כנענים ופלשתים.', clue:'אני עיר חוף עתיקה בדרום, עם שרידי פלשתים ופארק לאומי.'},
  {id:'hzl', name:'הרצליה',           type:'city',     diff:1, lat:32.1640,lng:34.8435, region:'שרון',          pop:97000,  icon:'💻', fact:'הרצליה "עמק הסיליקון הישראלי" בשל ריכוז חברות הייטק גדולות בפארקי התעשייה שלה.', clue:'אני "סיליקון ואדי" ישראלי, מרכז חברות ההייטק הגדולות.'},
  {id:'nzr', name:'נצרת',             type:'city',     diff:2, lat:32.6996,lng:35.3035, region:'גליל תחתון',   pop:78000,  icon:'⛪', fact:'נצרת מרכז הנצרות הגדול בישראל, עם כנסיית הבשורה הגדולה ביותר במזרח התיכון.', clue:'אני עיר הגליל הערבית הגדולה, עם כנסיית הבשורה החשובה.'},
  {id:'akk', name:'עכו',              type:'city',     diff:2, lat:32.9231,lng:35.0818, region:'גליל מערבי',   pop:50000,  icon:'🏰', fact:'עכו נמל עתיקה על חוף הים. מצודת הצלבנים ומנהרותיה נכללות ברשימת מורשת אונסקו.', clue:'אני עיר נמל עתיקה עם חומות ומנהרות צלבניות, אתר אונסקו.'},

  {q:'ליד איזה שדה תעופה נמצאת העיר לוד?',         a:'שדה תעופה בן גוריון',     opts:['נמל תעופה הרצליה','שדה תעופה בן גוריון','שדה דב','נמל חיפה'], diff:2, fact:'שדה התעופה הבינלאומי "בן גוריון" נמצא בין לוד לבן גוריון.'},
  {q:'מהו הנחל הארוך ביותר בישראל?',               a:'נחל הבשור',                opts:['נחל שורק','נחל אלכסנדר','נחל הבשור','נחל קישון'],            diff:2, fact:'נחל הבשור (110 ק"מ) הארוך ביותר, חוצה את הנגב ממזרח למערב.'},
  {q:'מהו היער הגדול ביותר בישראל?',               a:'יער יתיר',                 opts:['יער הכרמל','יער בן שמן','יער יתיר','יער בריה'],              diff:2, fact:'יער יתיר (30,000 דונם) הגדול ביותר, נטוע בשולי הנגב.'},
  {q:'על שפת איזה גוף מים שוכנת טבריה?',          a:'הכינרת',                   opts:['נהר הירדן','ים המלח','הכינרת','ים התיכון'],                  diff:2, fact:'טבריה שוכנת על חוף הכינרת (ים כינרת) בגליל.'},
  {q:'מהי העיר הידועה כ"עיר היהלומים"?',           a:'נתניה',                    opts:['אשדוד','הרצליה','נתניה','רחובות'],                           diff:2, fact:'נתניה "עיר היהלומים" בגלל תעשיית צחצוח יהלומים שפרחה בה.'},
  {q:'מאיזה הר יוצא אתר הסקי היחיד בישראל?',       a:'הר חרמון',                 opts:['הר מירון','הר הכרמל','הר תבור','הר חרמון'],                 diff:1, fact:'אתר הסקי "חרמון" היחיד בישראל, פועל בחורף על מדרונות החרמון.'},
  {q:'מה מיוחד בנחל אלכסנדר?',                    a:'צבי הנילוס הגדולים',       opts:['לוויתנים','צבי הנילוס הגדולים','כרישים','סרטנים גדולים'],    diff:3, fact:'בשפך נחל אלכסנדר מגיעים צבי-נילוס גדולים – הגדולים בעולם, עד 80 ס"מ.'},
  {q:'מהי הסיבה לפרסום מצדה?',                    a:'הלוחמים בחרו למות ולא להיכנע', opts:['עם אוצרות גנוזים','הלוחמים בחרו למות ולא להיכנע','קרב אלכסנדר הגדול','ניצחון מול הפרסים'], diff:3, fact:'ב-73 לספירה בחרו הלוחמים היהודים במצדה למות ולא להיכנע לרומאים.'},
  {q:'איזו עיר נקראת "עיר האמנים"?',              a:'צפת',                      opts:['עכו','ירושלים','צפת','כרמיאל'],                             diff:2, fact:'צפת ידועה כ"עיר האמנים" בשל גלריות רבות ואמנים שהתיישבו בה.'},
  {q:'מתי נוסדה פתח תקווה?',                      a:'1878',                     opts:['1860','1878','1900','1920'],                                diff:3, fact:'פתח תקווה נוסדה ב-1878, שנתיים לפני ראשון לציון.'},
  {q:'מהי העיר שבה מרכז מחקר מכון ויצמן?',        a:'רחובות',                   opts:['ירושלים','תל אביב','רחובות','חיפה'],                        diff:3, fact:'מכון ויצמן למדע שוכן ברחובות ומשמש כמרכז מחקר בין-לאומי.'},
  {q:'מה גובהו של הר חרמון?',                     a:'2,814 מ\'',                opts:['1,208 מ\'','1,750 מ\'','2,814 מ\'','3,500 מ\''],             diff:3, fact:'הר חרמון מגיע ל-2,814 מ\' ומכוסה שלג כ-4 חודשים בשנה.'},
  {q:'מה ידוע ביחודו של יער יתיר?',               a:'יער מדברי ייחודי בנגב',   opts:['יער הגשמים הגדול','יער מדברי ייחודי בנגב','יער העצים הגבוהים','יער ים התיכון הגדול'], diff:3, fact:'יער יתיר הוא מחקר ייחודי בעולם – גידול יער בשטח צחיח-מדברי.'},
  {q:'איזה נהר נובע ממעיינות ליד מושב דן?',       a:'נחל דן',                   opts:['נהר הירדן','נחל דן','נהר הירקון','נחל הבשור'],              diff:3, fact:'נחל דן נובע ממעיינות טבעיים עשירים ומהווה אחד ממקורות נהר הירדן.'},
];

const TOTAL = 10;
let gMode = 'map', gDiff = 1;
let score = 0, qNum = 0, usedIds = [], answered = false;
let currentLoc = null, currentGK = null, currentOpts = [];
let breakdown = {correct:0, wrong:0, byType:{}};
let leafMap, curMarker;

function pickMode(el) {
  document.querySelectorAll('.mode-card').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
  gMode = el.dataset.mode;
}
function pickDiff(el) {
  document.querySelectorAll('.diff-pill').forEach(p => p.classList.remove('selected'));
  el.classList.add('selected');
  gDiff = +el.dataset.diff;
}

function startGame() {
  score = 0; qNum = 0; usedIds = [];
  breakdown = {correct:0, wrong:0, byType:{}};
  document.getElementById('menuScreen').style.display    = 'none';
  document.getElementById('resultsScreen').style.display = 'none';
  document.getElementById('gameScreen').style.display    = 'block';
  document.getElementById('hdrStats').style.display      = 'flex';
  document.getElementById('qTot').textContent            = TOTAL;
  const modeNames = {map:'📍 מפה', clue:'💡 רמז', gk:'🧠 ידע כללי'};
  document.getElementById('modeBadge').textContent = modeNames[gMode];
  if (!leafMap) initLeaflet(); else leafMap.invalidateSize();
  const mapEl = document.getElementById('map');
  if (gMode === 'gk') mapEl.classList.add('map-small');
  else mapEl.classList.remove('map-small');
  nextQuestion();
}

function initLeaflet() {
  leafMap = L.map('map', {zoomControl:true, minZoom:6, maxZoom:13, attributionControl:true});
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
    {attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors © <a href="https://carto.com/attributions">CARTO</a>', subdomains:'abcd', maxZoom:20}).addTo(leafMap);
  leafMap.fitBounds([[29.2,33.9],[33.6,36.2]]);
}

function nextQuestion() {
  if (qNum >= TOTAL) { showResults(); return; }
  qNum++;
  answered = false;
  document.getElementById('scoreVal').textContent = score;
  document.getElementById('qNum').textContent     = qNum;
  document.getElementById('progFill').style.width = ((qNum-1)/TOTAL*100)+'%';
  document.getElementById('feedback').innerHTML   = '';
  if (curMarker) { curMarker.remove(); curMarker = null; }
  if (gMode === 'gk') buildGKQuestion();
  else buildLocationQuestion();
}

function buildGKQuestion() {
  document.getElementById('clueBox').style.display = 'none';
  const pool = GK.filter(q => q.diff <= gDiff && !usedIds.includes(q.q));
  if (!pool.length) { usedIds = []; buildGKQuestion(); return; }
  currentGK = pool[Math.floor(Math.random()*pool.length)];
  usedIds.push(currentGK.q);
  document.getElementById('questionText').textContent = '🧠 '+currentGK.q;
  buildButtons(currentGK.opts, currentGK.a, 4);
}

function buildLocationQuestion() {
  const pool = LOCATIONS.filter(l => l.diff <= gDiff && !usedIds.includes(l.id));
  if (pool.length < 3) { usedIds = []; buildLocationQuestion(); return; }
  const idx = Math.floor(Math.random()*pool.length);
  currentLoc = pool[idx];
  usedIds.push(currentLoc.id);
  if (gMode === 'map') {
    document.getElementById('clueBox').style.display = 'none';
    document.getElementById('questionText').textContent = '📍 מהו שמו של המקום המהבהב על המפה?';
    placeMarker(currentLoc);
    leafMap.flyToBounds(L.latLng(currentLoc.lat,currentLoc.lng).toBounds(80000),{maxZoom:8,animate:true,duration:.8});
  } else {
    document.getElementById('clueBox').style.display = 'block';
    document.getElementById('clueBox').innerHTML = '<strong>רמז:</strong> '+currentLoc.clue;
    document.getElementById('questionText').textContent = '💡 מהו שמו של המקום?';
  }
  const count = gMode === 'map' ? 3 : 4;
  const wrongs = LOCATIONS.filter(l=>l.id!==currentLoc.id).sort(()=>Math.random()-.5).slice(0,count-1).map(l=>l.name);
  const opts = [currentLoc.name,...wrongs].sort(()=>Math.random()-.5);
  buildButtons(opts, currentLoc.name, count);
}

function buildButtons(opts, correct, count) {
  const div = document.getElementById('answersDiv');
  div.innerHTML = '';
  for (let i=0;i<count;i++) {
    const b = document.createElement('button');
    b.className = 'answer-btn opt-'+i;
    b.textContent = opts[i];
    b.onclick = () => handleAnswer(b, opts[i]===correct, correct);
    div.appendChild(b);
  }
}

function placeMarker(loc) {
  const color = TYPE_COLORS[loc.type]||'#ff4757';
  const icon = L.divIcon({
    className:'leaflet-div-icon',
    html:`<div class="pulse-wrap"><div class="pulse-dot" style="background:${color}"></div><div class="pulse-ring" style="border-color:${color}"></div></div>`,
    iconSize:[60,60], iconAnchor:[30,30]
  });
  curMarker = L.marker([loc.lat,loc.lng],{icon,interactive:false}).addTo(leafMap);
}

function revealOnMap(loc) {
  if (curMarker) curMarker.remove();
  const color = TYPE_COLORS[loc.type]||'#ff4757';
  const icon = L.divIcon({
    className:'leaflet-div-icon',
    html:`<div class="pulse-wrap"><div class="pulse-dot" style="background:${color}"></div></div>`,
    iconSize:[60,60], iconAnchor:[30,30]
  });
  curMarker = L.marker([loc.lat,loc.lng],{icon}).addTo(leafMap);
  curMarker.bindPopup(`<div style="font-family:Heebo,Arial;font-weight:700;color:#6a11cb">${loc.name}</div>`,{closeButton:false}).openPopup();
  leafMap.flyTo([loc.lat,loc.lng],8,{animate:true,duration:1});
}

function handleAnswer(btn, isCorrect, correctText) {
  if (answered) return;
  answered = true;
  document.querySelectorAll('.answer-btn').forEach(b => b.disabled=true);
  document.querySelectorAll('.answer-btn').forEach(b => { if (b.textContent===correctText) b.classList.add('correct'); });
  const fb = document.getElementById('feedback');
  const locType = currentLoc ? currentLoc.type : 'gk';
  if (!breakdown.byType[locType]) breakdown.byType[locType] = {c:0,w:0};
  if (isCorrect) {
    score += 10;
    btn.classList.add('correct');
    fb.innerHTML  = '✅ &nbsp;כל הכבוד! תשובה נכונה! 🎉';
    fb.style.color = '#0f9b58';
    spawnStars(btn);
    breakdown.correct++;
    breakdown.byType[locType].c = (breakdown.byType[locType].c||0)+1;
  } else {
    btn.classList.add('wrong');
    btn.classList.add('shake');
    fb.innerHTML  = '❌ &nbsp;לא נכון! התשובה: <strong>'+correctText+'</strong>';
    fb.style.color = '#cb2d3e';
    breakdown.wrong++;
    breakdown.byType[locType].w = (breakdown.byType[locType].w||0)+1;
  }
  if (gMode==='clue' && currentLoc) revealOnMap(currentLoc);
  setTimeout(() => showInfoCard(gMode==='gk' ? null : currentLoc, gMode==='gk' ? currentGK : null), 1200);
}

function showInfoCard(loc, gk) {
  if (loc) {
    document.getElementById('icIcon').textContent  = loc.icon;
    document.getElementById('icTitle').textContent = loc.name;
    document.getElementById('icType').textContent  = TYPE_LABELS[loc.type]+' · '+loc.region;
    const badges = [];
    if (loc.pop)  badges.push('👥 '+loc.pop.toLocaleString()+' תושבים');
    if (loc.len)  badges.push('📏 '+loc.len+' ק"מ');
    if (loc.area) badges.push('🌳 '+loc.area.toLocaleString()+' דונם');
    if (loc.elev) badges.push('⛰️ '+loc.elev.toLocaleString()+' מ\'');
    badges.push('⭐'.repeat(loc.diff));
    document.getElementById('icBadges').innerHTML = badges.map(b=>'<span class="ic-badge">'+b+'</span>').join('');
    document.getElementById('icFact').textContent = loc.fact;
  } else if (gk) {
    document.getElementById('icIcon').textContent  = '🧠';
    document.getElementById('icTitle').textContent = gk.q;
    document.getElementById('icType').textContent  = 'ידע כללי';
    document.getElementById('icBadges').innerHTML  = '<span class="ic-badge">✅ '+gk.a+'</span>';
    document.getElementById('icFact').textContent  = gk.fact;
  }
  document.getElementById('infoOverlay').classList.add('show');
}

function closeInfoCard() {
  document.getElementById('infoOverlay').classList.remove('show');
  nextQuestion();
}

function spawnStars(elem) {
  const r=elem.getBoundingClientRect();
  const cx=r.left+r.width/2, cy=r.top+r.height/2;
  ['⭐','🌟','✨','🎊'].forEach((em,i) => {
    const el=document.createElement('div');
    el.className='float-star'; el.textContent=em;
    el.style.left=(cx+(Math.random()-.5)*100)+'px';
    el.style.top=cy+'px'; el.style.animationDelay=(i*.09)+'s';
    document.body.appendChild(el);
    el.addEventListener('animationend',()=>el.remove());
  });
}

function showResults() {
  document.getElementById('gameScreen').style.display   = 'none';
  document.getElementById('resultsScreen').style.display = 'block';
  document.getElementById('progFill').style.width = '100%';
  if (curMarker) { curMarker.remove(); curMarker=null; }
  const pct = score/(TOTAL*10)*100;
  let emoji,msg,color;
  if      (pct>=90){emoji='🏆';msg='מדהים! אתה/את אלוף/ה ידיעת הארץ!'; color='#f39c12';}
  else if (pct>=70){emoji='🥇';msg='מצוין! כל הכבוד!';                 color='#00b894';}
  else if (pct>=50){emoji='👍';msg='יפה! כדאי לתרגל עוד!';             color='#6c5ce7';}
  else             {emoji='📚';msg='תמשיך/י לתרגל – תצליח/י!';         color='#e17055';}
  const stars = '⭐'.repeat(Math.round(pct/20))||'—';
  const typeHeb = {city:'ערים',river:'נהרות',forest:'יערות',mountain:'הרים',lake:'ימים',gk:'ידע כללי'};
  const bkHtml = Object.entries(breakdown.byType).map(([t,v])=>
    '<div class="res-item"><div class="ri-label">'+(typeHeb[t]||t)+'</div><div class="ri-val">'+(v.c||0)+'/'+(( v.c||0)+(v.w||0))+'</div></div>').join('');
  document.getElementById('resultsScreen').innerHTML =
    '<div class="res-emoji">'+emoji+'</div>'+
    '<div class="res-msg" style="color:'+color+'">'+msg+'</div>'+
    '<div class="res-score">קיבלת <strong>'+score+'</strong> מתוך <strong>'+(TOTAL*10)+'</strong> נקודות</div>'+
    '<div class="res-stars">'+stars+'</div>'+
    '<div class="res-breakdown">'+bkHtml+'</div>'+
    '<button class="btn-start" onclick="backToMenu()">🏠 תפריט ראשי</button>&nbsp;'+
    '<button class="btn-start" style="margin-top:10px;background:linear-gradient(135deg,#00b894,#00cec9)" onclick="startGame()">🔄 שחק שוב</button>';
}

function backToMenu() {
  document.getElementById('resultsScreen').style.display = 'none';
  document.getElementById('menuScreen').style.display    = 'block';
  document.getElementById('hdrStats').style.display      = 'none';
  document.getElementById('progFill').style.width        = '0%';
}
</script>
</body>
</html>
