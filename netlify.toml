# Drushe
[build]
  publish = "."
  command = ""

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/ai-assistant"
  to = "/.netlify/functions/ai-assistant"
  status = 200

[[redirects]]
  from = "/api/send-push"
  to = "/.netlify/functions/send-push"
  status = 200

[[redirects]]
  from = "/api/parent-consent"
  to = "/.netlify/functions/parent-consent"
  status = 200

[[redirects]]
  from = "/api/password-reset"
  to = "/.netlify/functions/password-reset"
  status = 200

# מדיניות ה-cache מוגדרת כאן בלבד. קודם היא הופיעה גם בקובץ _headers, באותה
# נוסח בדיוק — שני מקורות אמת לאותו כלל, בלי דרך לדעת מהקוד מי גובר. _headers
# נמחק.
#
# הערך הקודם היה "no-cache, no-store, must-revalidate". ה-no-store הוא שעשה את
# הנזק: הוא אוסר על הדפדפן לשמור את התגובה בכלל, ולכן קובץ של 1.1MB ירד מחדש
# במלואו בכל פתיחה של האפליקציה — לא "נבדק אם השתנה", אלא ירד. קהל היעד הוא
# בני נוער עם חבילות גלישה מוגבלות.
#
# no-cache לבדו נותן בדיוק את מה שהכלל הזה נועד להשיג: הדפדפן שומר את הקובץ
# אבל מאמת מולנו בכל טעינה, ומקבל 304 של אפס בייטים כשאין שינוי. המשתמש
# מעודכן תמיד, בלי ההורדה.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache"

    # ── כותרות אבטחה ────────────────────────────────────────────────────────
    # לא היו כאן כלל. באפליקציה שמחזיקה מידע על קטינים — שם, מייל של ההורה
    # ותמונת מסמך מזהה — אלה ההגנות הזולות ביותר שיש, והן חסרו לגמרי.
    #
    # כל אחת נבחרה אחרי בדיקה מה האפליקציה באמת עושה, לא מרשימת המלצות:

    # הדפדפן לא ינחש סוג תוכן. מונע הרצה של קובץ שהועלה (למשל "תמונת" מסמך
    # מזהה) כאילו היה סקריפט.
    X-Content-Type-Options = "nosniff"

    # לא מדליפים את הנתיב המלא — שעשוי להכיל טוקן, כמו ‎?parentView=<token>‎
    # שבמייל להורים — לאתרים חיצוניים שהמשתמש עובר אליהם.
    Referrer-Policy = "strict-origin-when-cross-origin"

    # אין באפליקציה שום iframe (נבדק: 0 מופעים ב-index.html), ולכן חסימת
    # מסגור היא ללא עלות ומונעת clickjacking. מעטפת ה-Capacitor טוענת את
    # האתר כדף עליון ב-WebView, לא בתוך מסגרת — כך שהיא לא מושפעת.
    X-Frame-Options = "DENY"

    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

    # self לשלוש היכולות שהאפליקציה באמת משתמשת בהן — נבדק בקוד:
    # navigator.geolocation (מסך "בסביבה"), getUserMedia ו-capture= בהעלאת
    # תמונה. השאר נחסם לחלוטין. אסור לצמצם כאן בלי לבדוק קודם בקוד: כותרת
    # שחוסמת יכולת בשימוש שוברת פיצ'ר בלי הודעת שגיאה מובנת.
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=(self), payment=(), usb=(), serial=(), bluetooth=(), midi=()"

# תמונות ואייקונים לא משתנים בין גרסאות (icon-512.png לבדו הוא 150KB).
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
