<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<title>משחק ידיעת הארץ 🇮🇱</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:'Rubik','Arial',sans-serif;overflow:hidden;user-select:none;background:#000}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center}
.screen.active{display:flex}

/* ── START ── */
#screen-start{
  background:linear-gradient(160deg,#0d1b2a 0%,#1a3a5c 60%,#0d2a1a 100%);
  justify-content:center;padding:28px 20px;
}
.s-icon{font-size:72px;line-height:1;margin-bottom:10px;animation:fl 3s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.s-title{font-size:32px;font-weight:900;color:#fff;text-align:center;text-shadow:0 2px 12px rgba(0,200,100,.4);margin-bottom:5px}
.s-sub{font-size:14px;color:rgba(255,255,255,.7);margin-bottom:28px;text-align:center}
.s-label{font-size:11px;font-weight:700;color:rgba(255,255,255,.5);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:13px}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:340px}
.dbtn{
  background:rgba(255,255,255,.09);border:1.5px solid rgba(255,255,255,.18);
  border-radius:20px;padding:18px 10px 14px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:5px;
  transition:transform .15s,background .15s;font-family:inherit;
}
.dbtn:active{transform:scale(.95);background:rgba(255,255,255,.18)}
.de{font-size:32px;line-height:1}
.dn{font-size:16px;font-weight:800;color:#fff}
.dd{font-size:11px;color:rgba(255,255,255,.6);text-align:center;line-height:1.4}

/* ── GAME ── */
#screen-game{background:#000}
.ghdr{
  background:rgba(0,0,0,.8);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  width:100%;padding:10px 14px;
  display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0;border-bottom:1px solid rgba(255,255,255,.08);z-index:20;
}
.gsc{display:flex;align-items:center;gap:4px;color:#FFD700;font-size:19px;font-weight:800}
.gqc{background:rgba(255,255,255,.14);border-radius:20px;padding:4px 13px;font-size:13px;font-weight:700;color:#fff;white-space:nowrap}
.glt{background:rgba(255,255,255,.1);border-radius:12px;padding:4px 11px;font-size:13px;font-weight:600;color:#fff}
.pbar{width:100%;height:5px;background:rgba(255,255,255,.08);flex-shrink:0;z-index:20}
.pfill{height:100%;background:linear-gradient(90deg,#00e676,#69f0ae);transition:width .4s}
.qtxt{
  background:rgba(0,0,0,.65);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  width:100%;padding:11px 16px;text-align:center;font-size:17px;font-weight:800;color:#fff;
  border-bottom:1px solid rgba(255,255,255,.07);flex-shrink:0;z-index:20;
  text-shadow:0 1px 6px rgba(0,0,0,.9);
}

/* ── MAP ── */
#map-wrap{
  flex:1;width:100%;position:relative;overflow:hidden;
  background:#b8d4e8;min-height:0;
}
/* ── MARKER: canvas overlay, see buildMap/placeMarker ── */

/* ── ANSWERS ── */
.apan{
  background:rgba(8,8,12,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  width:100%;
  padding:10px 12px max(14px,env(safe-area-inset-bottom));
  display:grid;grid-template-columns:repeat(3,1fr);gap:9px;
  flex-shrink:0;border-top:1px solid rgba(255,255,255,.09);z-index:20;
}
.abtn{
  background:rgba(255,255,255,.09);border:2px solid rgba(255,255,255,.18);
  border-radius:16px;padding:12px 5px;font-size:14px;font-weight:700;color:#fff;
  cursor:pointer;transition:all .12s;font-family:inherit;
  min-height:52px;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.3;
}
.abtn:active:not(:disabled){transform:scale(.95);background:rgba(255,255,255,.18)}
.abtn.ok{background:rgba(76,175,80,.3);border-color:#4CAF50;color:#A5D6A7}
.abtn.no{background:rgba(244,67,54,.28);border-color:#F44336;color:#EF9A9A}
.abtn:disabled{cursor:default}

/* ── FEEDBACK ── */
.fbo{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  z-index:100;pointer-events:none;opacity:0;transition:opacity .18s;
  background:rgba(0,0,0,.28);
}
.fbo.show{opacity:1}
.fbx{
  background:rgba(18,18,28,.93);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.13);border-radius:26px;
  padding:22px 38px;text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.65);transform:scale(.75);
  transition:transform .3s cubic-bezier(.34,1.56,.64,1);
}
.fbo.show .fbx{transform:scale(1)}
.fbe{font-size:56px;line-height:1;margin-bottom:6px}
.fbt{font-size:21px;font-weight:900;color:#fff}
.fbt.ok{color:#69f0ae} .fbt.no{color:#ff8a80}
.fbs{font-size:14px;color:rgba(255,255,255,.6);margin-top:4px}

/* ── END ── */
#screen-end{
  background:linear-gradient(160deg,#0d1b2a,#1a3a5c 60%,#0d2a1a);
  justify-content:center;align-items:center;padding:28px 20px;
}
.eico{font-size:74px;line-height:1;margin-bottom:12px;animation:bn .55s ease infinite alternate}
@keyframes bn{from{transform:translateY(0)}to{transform:translateY(-13px)}}
.etit{font-size:28px;font-weight:900;color:#fff;text-align:center;margin-bottom:8px}
.enum{font-size:62px;font-weight:900;color:#FFD700;text-align:center;line-height:1}
.elbl{font-size:15px;color:rgba(255,255,255,.55);text-align:center;margin-bottom:14px}
.estr{font-size:40px;letter-spacing:4px;text-align:center;margin-bottom:10px}
.emsg{font-size:14px;color:rgba(255,255,255,.72);text-align:center;margin-bottom:26px;font-weight:500;line-height:1.5;max-width:270px}
.ebtns{display:flex;flex-direction:column;gap:11px;width:100%;max-width:250px}
.ebm{
  background:linear-gradient(90deg,#00c853,#1b5e20);color:#fff;border:none;border-radius:20px;
  padding:17px;font-size:16px;font-weight:800;cursor:pointer;font-family:inherit;
  box-shadow:0 8px 24px rgba(0,200,83,.3);transition:transform .15s;
}
.ebm:active{transform:scale(.96)}
.ebs{
  background:rgba(255,255,255,.07);color:rgba(255,255,255,.75);
  border:1.5px solid rgba(255,255,255,.18);border-radius:20px;
  padding:13px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:transform .15s;
}
.ebs:active{transform:scale(.96)}

/* ── CONFETTI ── */
.cf{position:fixed;top:-12px;border-radius:2px;animation:cff linear forwards;z-index:999}
@keyframes cff{0%{transform:translateY(0) rotate(0deg);opacity:1}100%{transform:translateY(105vh) rotate(800deg);opacity:0}}
</style>
</head>
<body>

<!-- ══ START ══════════════════════════ -->
<div id="screen-start" class="screen active">
  <div class="s-icon">🛰️</div>
  <h1 class="s-title">ידיעת הארץ</h1>
  <p class="s-sub">נחש את שם הישוב על מפת הלוויין!</p>
  <div class="s-label">בחר רמת קושי</div>
  <div class="dgrid">
    <button class="dbtn" onclick="startGame('easy')">
      <span class="de">🌱</span><span class="dn">קל</span><span class="dd">ערים גדולות</span>
    </button>
    <button class="dbtn" onclick="startGame('medium')">
      <span class="de">🌟</span><span class="dn">בינוני</span><span class="dd">ערים ויישובים</span>
    </button>
    <button class="dbtn" onclick="startGame('hard')">
      <span class="de">🎓</span><span class="dn">קשה</span><span class="dd">ערים קטנות</span>
    </button>
    <button class="dbtn" onclick="startGame('expert')">
      <span class="de">🏆</span><span class="dn">אלוף</span><span class="dd">כל הישובים</span>
    </button>
  </div>
</div>

<!-- ══ GAME ═══════════════════════════ -->
<div id="screen-game" class="screen">
  <div class="ghdr">
    <div class="gsc">⭐ <span id="scoreVal">0</span></div>
    <div class="gqc" id="qCounter">שאלה 1 / 10</div>
    <div class="glt" id="levelTag">קל</div>
  </div>
  <div class="pbar"><div class="pfill" id="progressFill" style="width:0%"></div></div>
  <div class="qtxt">מה שם הישוב המסומן? 🤔</div>
  <div id="map-wrap">
    <!-- Satellite tiles loaded dynamically as <img> tags -->

  </div>
  <div class="apan">
    <button class="abtn" id="btn0" onclick="checkAnswer(0)"></button>
    <button class="abtn" id="btn1" onclick="checkAnswer(1)"></button>
    <button class="abtn" id="btn2" onclick="checkAnswer(2)"></button>
  </div>
</div>

<!-- ══ END ════════════════════════════ -->
<div id="screen-end" class="screen">
  <div class="eico" id="eico">🎉</div>
  <h2 class="etit" id="etit">כל הכבוד!</h2>
  <div class="enum" id="enum">8/10</div>
  <div class="elbl">תשובות נכונות</div>
  <div class="estr" id="estr">⭐⭐⭐</div>
  <div class="emsg" id="emsg">מצוין!</div>
  <div class="ebtns">
    <button class="ebm" onclick="restartSame()">🔄 שחק שוב</button>
    <button class="ebs" onclick="goHome()">🏠 החלף רמה</button>
  </div>
</div>

<!-- Feedback overlay -->
<div class="fbo" id="fbo">
  <div class="fbx">
    <div class="fbe" id="fbe">✅</div>
    <div class="fbt" id="fbt">כל הכבוד!</div>
    <div class="fbs" id="fbs"></div>
  </div>
</div>

// Geographic bounds of this relief image
const IMG_MIN_LAT = 29.45, IMG_MAX_LAT = 33.37;
const IMG_MIN_LNG = 34.17, IMG_MAX_LNG = 35.88;

function _mY(lat) {
  const r = lat * Math.PI / 180;
  return Math.log(Math.tan(Math.PI / 4 + r / 2));
}
const MY_MIN = _mY(IMG_MIN_LAT);
const MY_MAX = _mY(IMG_MAX_LAT);

function geo2pct(lat, lng) {
  const px = (lng - IMG_MIN_LNG) / (IMG_MAX_LNG - IMG_MIN_LNG) * 100;
  const py = (1 - (_mY(lat) - MY_MIN) / (MY_MAX - MY_MIN)) * 100;
  return [px, py];
}

let _markerXY = null, _animRaf = null;

function placeMarker(lat, lng, radiusKm) {
  if (!_mapRect) return;
  const [px_pct, py_pct] = geo2pct(lat, lng);
  const cx = _mapRect.offsetX + px_pct / 100 * _mapRect.dispW;
  const cy = _mapRect.offsetY + py_pct / 100 * _mapRect.dispH;
  const pxPerKm = _mapRect.dispH / (IMG_MAX_LAT - IMG_MIN_LAT) / 111;
  const baseR = Math.max(6, pxPerKm * (radiusKm || 8));
  _markerXY = {cx, cy, baseR};
  if (_animRaf) { cancelAnimationFrame(_animRaf); _animRaf = null; }
  _drawArea();
}

function _drawArea() {
  const oc = document.getElementById('city-canvas');
  if (!oc || !_markerXY) return;
  const ctx = oc.getContext('2d');
  ctx.clearRect(0, 0, oc.width, oc.height);

  const {cx, cy, baseR} = _markerXY;
  const t = Date.now() / 1000;
  // Sharp blink: 0.65s ON / 0.45s OFF
  const on = (t % 1.1) < 0.65;

  const s = cx * 0.137 + cy * 0.271;
  const rotAngle = (s * 3.7) % Math.PI;
  const elongX   = 0.82 + 0.42 * ((s * 5.1) % 1);
  const elongY   = 0.82 + 0.42 * ((s * 7.3) % 1);

  const numLobes = 3 + Math.floor((s * 4.1) % 3);
  const lobes = [];
  for (let b = 0; b < numLobes; b++) {
    lobes.push({
      angle:  (s * 6.1 + b * 2.4) % (Math.PI * 2),
      height: 0.28 + 0.38 * ((s * 11.3 + b * 5.7) % 1),
      width:  0.25 + 0.38 * ((s * 13.7 + b * 4.1) % 1),
    });
  }

  const N = 72;
  const cosR = Math.cos(rotAngle), sinR = Math.sin(rotAngle);

  function poly() {
    ctx.beginPath();
    for (let i = 0; i <= N; i++) {
      const a = (i / N) * Math.PI * 2;
      let r = baseR;
      for (const lobe of lobes) {
        const diff = Math.abs(((a - lobe.angle + Math.PI * 3) % (Math.PI * 2)) - Math.PI);
        if (diff < lobe.width * Math.PI) {
          const factor = Math.cos((diff / (lobe.width * Math.PI)) * Math.PI / 2) ** 2;
          r += baseR * lobe.height * factor;
        }
      }
      r *= 1 + 0.04 * Math.sin(s * 37 + i * 5.1) + 0.025 * Math.sin(s * 71 + i * 9.3);
      const lx = Math.cos(a) * r * elongX;
      const ly = Math.sin(a) * r * elongY;
      const x = cx + lx * cosR - ly * sinR;
      const y = cy + lx * sinR + ly * cosR;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.closePath();
  }

  if (on) {
    poly();
    ctx.fillStyle = 'rgba(255,210,0,0.50)';
    ctx.fill();
    poly();
    ctx.strokeStyle = 'rgba(200,20,0,0.97)';
    ctx.lineWidth = Math.max(2, baseR * 0.18);
    ctx.stroke();
  }

  _animRaf = requestAnimationFrame(_drawArea);
}

  level=lvl;
  const cfg=LVLS[lvl];
  pool=shuffle([...cfg.cities]);
  used=[]; score=0; qNum=0;
  document.getElementById('levelTag').textContent=cfg.em+' '+cfg.name;
  document.getElementById('scoreVal').textContent='0';
  document.getElementById('progressFill').style.width='0%';

  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    buildMap();

  }));

  if(qNum>=TOTAL){endGame();return;}

  let ci;

  for(let i=0;i<3;i++){
    const b=document.getElementById('btn'+i);
    b.textContent=opts[i]; b.className='abtn'; b.disabled=false;
  }

  const _r = T1.some(c=>c.name===correct.name)?8:
             T2.some(c=>c.name===correct.name)?5.5:
             T3.some(c=>c.name===correct.name)?3.5:2;
  placeMarker(correct.lat, correct.lng, _r);
  locked=false;
}

function checkAnswer(idx){
  if(locked) return;
  locked=true;
  for(let i=0;i<3;i++) document.getElementById('btn'+i).disabled=true;
  const ok=idx===correctIdx;
  document.getElementById('btn'+idx).classList.add(ok?'ok':'no');
  if(!ok) document.getElementById('btn'+correctIdx).classList.add('ok');
  if(ok){score++;document.getElementById('scoreVal').textContent=score;}

  document.getElementById('fbe').textContent=ok
    ?['🎉','⭐','🌟','💪','🏆'][Math.floor(Math.random()*5)]:'❌';
  const ft=document.getElementById('fbt');
  ft.textContent=ok?OKP[Math.floor(Math.random()*OKP.length)]:NOP[Math.floor(Math.random()*NOP.length)];
  ft.className='fbt '+(ok?'ok':'no');
  document.getElementById('fbs').textContent=ok?'':'התשובה: '+document.getElementById('btn'+correctIdx).textContent;

  const ov=document.getElementById('fbo');
  ov.classList.add('show');
  if(ok&&score%3===0) confetti();
  setTimeout(()=>{ov.classList.remove('show');setTimeout(nextQ,180);},1400);
}

function endGame(){
  const p=score/TOTAL;
  let ico,ttl,str,msg;
  if(p===1)    {ico='🏆';ttl='מושלם לחלוטין!';str='⭐⭐⭐⭐⭐';msg='תוצאה מושלמת! אתה אלוף ידיעת הארץ!'}
  else if(p>=.8){ico='🎉';ttl='כל הכבוד!';    str='⭐⭐⭐⭐';  msg='תוצאה מצוינת! אתה מכיר את ישראל יפה מאוד!'}
  else if(p>=.6){ico='😊';ttl='יפה מאוד!';    str='⭐⭐⭐';    msg='תוצאה טובה! עוד קצת אימון ותגיע למקסימום!'}
  else if(p>=.4){ico='📚';ttl='ממשיכים!';     str='⭐⭐';      msg='נסה שוב ותשפר את הציון שלך!'}
  else          {ico='💪';ttl='אל תתייאש!';   str='⭐';        msg='כל ניסיון מלמד! תנסה שוב!'}
  document.getElementById('eico').textContent=ico;
  document.getElementById('etit').textContent=ttl;
  document.getElementById('enum').textContent=`${score}/${TOTAL}`;
  document.getElementById('estr').textContent=str;
  document.getElementById('emsg').textContent=msg;
  if(p>=.8) confetti();
  show('screen-end');
}

function restartSame(){startGame(level);}

function shuffle(a){
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function confetti(){
  const cls=['#ff6b35','#ffd700','#4caf50','#2196f3','#e91e63','#9c27b0','#00bcd4'];
  for(let i=0;i<50;i++) setTimeout(()=>{
    const e=document.createElement('div'); e.className='cf';
    e.style.cssText=`left:${Math.random()*100}vw;width:${7+Math.random()*7}px;height:${7+Math.random()*7}px;background:${cls[Math.floor(Math.random()*cls.length)]};border-radius:${Math.random()>.5?'50%':'3px'};animation-duration:${2.5+Math.random()*2}s;animation-delay:${Math.random()*.4}s`;
    document.body.appendChild(e); setTimeout(()=>e.remove(),4500);
  },i*25);
}
</script>
