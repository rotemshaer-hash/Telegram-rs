<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<title>משחק ידיעת הארץ 🇮🇱</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:'Rubik','Arial',sans-serif;overflow:hidden;user-select:none;background:#1565c0}

.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center}
.screen.active{display:flex}

/* ── START ─────────────────────────────── */
#screen-start{
  background:linear-gradient(160deg,#1565c0 0%,#01579b 100%);
  justify-content:center;padding:28px 20px;gap:0;
}
.start-flag{font-size:70px;line-height:1;margin-bottom:8px;animation:fl 3s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.start-title{font-size:32px;font-weight:900;color:#fff;text-align:center;text-shadow:0 3px 10px rgba(0,0,0,.3);margin-bottom:4px}
.start-sub{font-size:14px;color:rgba(255,255,255,.85);margin-bottom:26px;text-align:center}
.diff-label{font-size:11px;font-weight:700;color:rgba(255,255,255,.7);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:12px}
.diff-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:340px}
.diff-btn{
  background:#fff;border:none;border-radius:20px;padding:18px 10px 14px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:5px;
  box-shadow:0 8px 28px rgba(0,0,0,.22);transition:transform .15s;font-family:inherit;
}
.diff-btn:active{transform:scale(.95)}
.de{font-size:32px;line-height:1}
.dn{font-size:16px;font-weight:800;color:#0d47a1}
.dd{font-size:11px;color:#666;font-weight:500;text-align:center;line-height:1.4}

/* ── GAME ─────────────────────────────── */
#screen-game{background:#f0f9ff}
.ghdr{
  background:linear-gradient(90deg,#1565c0,#0288d1);
  width:100%;padding:10px 14px;
  display:flex;align-items:center;justify-content:space-between;flex-shrink:0;
}
.sc{display:flex;align-items:center;gap:4px;color:#fff;font-size:19px;font-weight:800}
.qc{
  background:rgba(255,255,255,.22);border-radius:20px;
  padding:4px 13px;font-size:13px;font-weight:700;color:#fff;white-space:nowrap;
}
.lt{background:rgba(255,255,255,.18);border-radius:12px;padding:4px 11px;font-size:13px;font-weight:600;color:#fff}
.pbar{width:100%;height:6px;background:rgba(0,0,0,.1);flex-shrink:0}
.pfill{height:100%;background:linear-gradient(90deg,#81d4fa,#4fc3f7);transition:width .4s}
.qtxt{
  background:#fff;width:100%;padding:11px 16px;
  text-align:center;font-size:17px;font-weight:800;color:#0d1b2a;
  border-bottom:3px solid #e3f2fd;flex-shrink:0;
}

/* ── MAP ─────────────────────────────── */
#map-wrap{flex:1;width:100%;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#a8d8ea}
#israel-svg{display:block;max-width:100%;max-height:100%}

/* ── MARKER ─────────────────────────── */
#city-marker{
  position:absolute;transform:translate(-50%,-50%);
  display:none;pointer-events:none;z-index:10;
  width:50px;height:50px;
}
.pmr{
  position:absolute;top:50%;left:50%;
  width:16px;height:16px;border-radius:50%;
  background:rgba(255,61,0,.5);
  transform:translate(-50%,-50%);
  animation:pmx 1.8s ease-out infinite;
}
.pmr:nth-child(2){animation-delay:.6s}
.pmr:nth-child(3){animation-delay:1.2s}
@keyframes pmx{
  0%{transform:translate(-50%,-50%) scale(1);opacity:.8}
  100%{transform:translate(-50%,-50%) scale(5);opacity:0}
}
.pmd{
  position:absolute;top:50%;left:50%;width:18px;height:18px;
  background:#ff3d00;border-radius:50%;border:3px solid #fff;
  transform:translate(-50%,-50%);
  box-shadow:0 2px 10px rgba(255,61,0,.7);z-index:2;
}

/* ── ANSWERS ─────────────────────────── */
.apan{
  background:#fff;width:100%;
  padding:11px 12px max(14px,env(safe-area-inset-bottom));
  display:grid;grid-template-columns:repeat(3,1fr);gap:9px;
  flex-shrink:0;box-shadow:0 -4px 20px rgba(0,0,0,.1);
}
.abtn{
  background:#e3f2fd;border:3px solid transparent;border-radius:16px;
  padding:12px 5px;font-size:14px;font-weight:700;color:#1565c0;
  cursor:pointer;transition:all .12s;font-family:inherit;
  min-height:52px;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.3;
}
.abtn:active:not(:disabled){transform:scale(.95)}
.abtn.ok{background:#e8f5e9;border-color:#43a047;color:#2e7d32}
.abtn.no{background:#ffebee;border-color:#e53935;color:#b71c1c}
.abtn:disabled{cursor:default}

/* ── FEEDBACK ─────────────────────────── */
.fbo{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  z-index:1000;pointer-events:none;opacity:0;transition:opacity .18s;
}
.fbo.show{opacity:1}
.fbx{
  background:#fff;border-radius:26px;padding:22px 38px;text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.22);transform:scale(.75);
  transition:transform .3s cubic-bezier(.34,1.56,.64,1);
}
.fbo.show .fbx{transform:scale(1)}
.fbe{font-size:58px;line-height:1;margin-bottom:6px}
.fbt{font-size:21px;font-weight:900}
.fbt.ok{color:#2e7d32} .fbt.no{color:#b71c1c}
.fbs{font-size:14px;color:#666;margin-top:4px}

/* ── END ─────────────────────────────── */
#screen-end{
  background:linear-gradient(160deg,#fff9c4,#ffe082 50%,#ffca28);
  justify-content:center;align-items:center;padding:28px 20px;
}
.eico{font-size:74px;line-height:1;margin-bottom:12px;animation:bn .55s ease infinite alternate}
@keyframes bn{from{transform:translateY(0)}to{transform:translateY(-13px)}}
.etitle{font-size:28px;font-weight:900;color:#1a1a2e;text-align:center;margin-bottom:8px}
.enum{font-size:62px;font-weight:900;color:#e65100;text-align:center;line-height:1}
.elbl{font-size:15px;color:#5d4037;text-align:center;margin-bottom:14px}
.estr{font-size:40px;letter-spacing:4px;text-align:center;margin-bottom:10px}
.emsg{font-size:14px;color:#4e342e;text-align:center;margin-bottom:26px;font-weight:500;line-height:1.5;max-width:270px}
.ebtns{display:flex;flex-direction:column;gap:11px;width:100%;max-width:250px}
.ebm{
  background:linear-gradient(90deg,#ff6b35,#e64a19);color:#fff;border:none;border-radius:20px;
  padding:17px;font-size:16px;font-weight:800;cursor:pointer;font-family:inherit;
  box-shadow:0 8px 24px rgba(230,74,25,.4);transition:transform .15s;
}
.ebm:active{transform:scale(.96)}
.ebs{
  background:#fff;color:#e65100;border:3px solid #ffca28;border-radius:20px;
  padding:13px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:transform .15s;
}
.ebs:active{transform:scale(.96)}

/* ── CONFETTI ─────────────────────────── */
.cf{position:fixed;top:-12px;border-radius:2px;animation:cff linear forwards;z-index:999}
@keyframes cff{0%{transform:translateY(0) rotate(0deg);opacity:1}100%{transform:translateY(105vh) rotate(800deg);opacity:0}}
</style>
</head>
<body>

<!-- ══ START ══════════════════════════════ -->
<div id="screen-start" class="screen active">
  <div class="start-flag">🗺️</div>
  <h1 class="start-title">ידיעת הארץ</h1>
  <p class="start-sub">נחש את שם הישוב על המפה!</p>
  <div class="diff-label">בחר רמת קושי</div>
  <div class="diff-grid">
    <button class="diff-btn" onclick="startGame('easy')">
      <span class="de">🌱</span><span class="dn">קל</span><span class="dd">ערים גדולות</span>
    </button>
    <button class="diff-btn" onclick="startGame('medium')">
      <span class="de">🌟</span><span class="dn">בינוני</span><span class="dd">ערים ויישובים</span>
    </button>
    <button class="diff-btn" onclick="startGame('hard')">
      <span class="de">🎓</span><span class="dn">קשה</span><span class="dd">ערים קטנות</span>
    </button>
    <button class="diff-btn" onclick="startGame('expert')">
      <span class="de">🏆</span><span class="dn">אלוף</span><span class="dd">כל הישובים</span>
    </button>
  </div>
</div>

<!-- ══ GAME ═══════════════════════════════ -->
<div id="screen-game" class="screen">
  <div class="ghdr">
    <div class="sc">⭐ <span id="scoreVal">0</span></div>
    <div class="qc" id="qCounter">שאלה 1 / 10</div>
    <div class="lt" id="levelTag">קל</div>
  </div>
  <div class="pbar"><div class="pfill" id="progressFill" style="width:0%"></div></div>
  <div class="qtxt">מה שם הישוב המסומן? 🤔</div>

  <div id="map-wrap">
    <!--
      ViewBox 0 0 300 640
      svgX = 10 + (lng - 34.10) / 1.85 * 280
      svgY = 10 + (33.50 - lat) / 4.20 * 620
    -->
    <svg id="israel-svg" viewBox="0 0 300 640" preserveAspectRatio="xMidYMid meet">
      <defs>
        <linearGradient id="seaGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#6EC6E6"/>
          <stop offset="100%" stop-color="#3A9EC2"/>
        </linearGradient>
        <linearGradient id="landGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#8CC665"/>
          <stop offset="55%" stop-color="#A8C87A"/>
          <stop offset="100%" stop-color="#D4BC6A"/>
        </linearGradient>
      </defs>

      <!-- Sea -->
      <rect width="300" height="640" fill="url(#seaGrad)"/>

      <!-- Israel land polygon -->
      <polygon
        points="161,72 184,64 232,42 261,126 247,129 229,158 224,206 218,262 217,362 176,445 143,576 128,583 58,590 51,390 55,339 36,286 75,278 110,216 129,165 141,109 156,93"
        fill="url(#landGrad)" stroke="#5a8a3a" stroke-width="1.5" stroke-linejoin="round"/>

      <!-- Kinneret (Sea of Galilee) -->
      <ellipse cx="237" cy="121" rx="14" ry="22" fill="#4CA8D4" stroke="#2E88B4" stroke-width="1"/>
      <text x="237" y="124" font-size="7" fill="white" text-anchor="middle" font-weight="bold" font-family="Arial">כנרת</text>

      <!-- Dead Sea -->
      <ellipse cx="220" cy="318" rx="11" ry="42" fill="#4CA8D4" stroke="#2E88B4" stroke-width="1" opacity=".85"/>
      <text x="220" y="315" font-size="6.5" fill="white" text-anchor="middle" font-weight="bold" font-family="Arial">ים</text>
      <text x="220" y="324" font-size="6.5" fill="white" text-anchor="middle" font-weight="bold" font-family="Arial">המלח</text>

      <!-- Gulf of Aqaba / Eilat -->
      <polygon points="128,583 143,576 150,615 128,640 108,640" fill="#4CA8D4" stroke="#2E88B4" stroke-width="1" opacity=".8"/>
      <text x="124" y="625" font-size="6" fill="white" text-anchor="middle" font-weight="bold" font-family="Arial">מפרץ אילת</text>

      <!-- Mediterranean label -->
      <text x="28" y="300" font-size="8" fill="rgba(255,255,255,.7)" text-anchor="middle"
        transform="rotate(-90,28,300)" font-family="Arial">הים התיכון</text>
    </svg>

    <!-- Pulsing marker (positioned by JS) -->
    <div id="city-marker">
      <div class="pmr"></div>
      <div class="pmr"></div>
      <div class="pmr"></div>
      <div class="pmd"></div>
    </div>
  </div>

  <div class="apan">
    <button class="abtn" id="btn0" onclick="checkAnswer(0)"></button>
    <button class="abtn" id="btn1" onclick="checkAnswer(1)"></button>
    <button class="abtn" id="btn2" onclick="checkAnswer(2)"></button>
  </div>
</div>

<!-- ══ END ════════════════════════════════ -->
<div id="screen-end" class="screen">
  <div class="eico" id="eico">🎉</div>
  <h2 class="etitle" id="etitle">כל הכבוד!</h2>
  <div class="enum" id="enum">8/10</div>
  <div class="elbl">תשובות נכונות</div>
  <div class="estr" id="estr">⭐⭐⭐</div>
  <div class="emsg" id="emsg">מצוין!</div>
  <div class="ebtns">
    <button class="ebm" onclick="restartSame()">🔄 שחק שוב</button>
    <button class="ebs" onclick="goHome()">🏠 החלף רמה</button>
  </div>
</div>

<!-- Feedback overlay -->
<div class="fbo" id="fbo">
  <div class="fbx">
    <div class="fbe" id="fbe">✅</div>
    <div class="fbt" id="fbt">כל הכבוד!</div>
    <div class="fbs" id="fbs"></div>
  </div>
</div>

<script>
// ═══ MAP PROJECTION ═══════════════════════════
// ViewBox: 300 × 640
// svgX = 10 + (lng - 34.10) / 1.85 * 280
// svgY = 10 + (33.50 - lat) / 4.20 * 620
const VBW=300, VBH=640;
function toSVG(lat,lng){
  return {
    x: 10 + (lng - 34.10) / 1.85 * 280,
    y: 10 + (33.50 - lat) / 4.20 * 620
  };
}

function placeMarker(lat,lng){
  const wrap = document.getElementById('map-wrap');
  const svg  = document.getElementById('israel-svg');
  const wr   = wrap.getBoundingClientRect();
  const sr   = svg.getBoundingClientRect();

  // SVG renders with "meet" — actual rendered rect is sr
  const scaleX = sr.width  / VBW;
  const scaleY = sr.height / VBH;
  // Because preserveAspectRatio=meet, both axes use the same scale
  const scale  = Math.min(scaleX, scaleY);

  const rendW = VBW * scale;
  const rendH = VBH * scale;
  // Offset of rendered SVG within the SVG element rect
  const offX  = (sr.width  - rendW) / 2;
  const offY  = (sr.height - rendH) / 2;

  const {x:svgX, y:svgY} = toSVG(lat,lng);

  // pixel position within map-wrap
  const px = (sr.left - wr.left) + offX + svgX * scale;
  const py = (sr.top  - wr.top)  + offY + svgY * scale;

  const m = document.getElementById('city-marker');
  m.style.left    = px + 'px';
  m.style.top     = py + 'px';
  m.style.display = 'block';
}

const LVLS={
  easy:  {name:"קל",    em:"🌱", cities:[...T1]},
  medium:{name:"בינוני",em:"🌟", cities:[...T1,...T2]},
  hard:  {name:"קשה",   em:"🎓", cities:[...T1,...T2,...T3]},
  expert:{name:"אלוף",  em:"🏆", cities:[...T1,...T2,...T3,...T4]},
};

// ═══ STATE ════════════════════════════════════
let level,pool,used=[],score,qNum,correctIdx,locked;
const TOTAL=10;
const OKP=["כל הכבוד!","נכון! ⭐","מצוין! 🌟","אדיר! 💪","מושלם! 🏆","יפה מאוד!"];
const NOP=["לא נכון...","נסה שוב בפעם הבאה","כמעט!","אופס!"];

// ═══ SCREENS ══════════════════════════════════
function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function goHome(){ show('screen-start'); }

// ═══ START ════════════════════════════════════
function startGame(lvl){
  level=lvl;
  const cfg=LVLS[lvl];
  pool=shuffle([...cfg.cities]);
  used=[]; score=0; qNum=0;
  document.getElementById('levelTag').textContent=cfg.em+' '+cfg.name;
  document.getElementById('scoreVal').textContent='0';
  show('screen-game');
  // small delay to let layout settle before measuring SVG
  requestAnimationFrame(()=>requestAnimationFrame(nextQ));
}

// ═══ QUESTION ════════════════════════════════
function nextQ(){
  if(qNum>=TOTAL){endGame();return;}
  if(used.length>=pool.length) used=[];

  let ci;
  do{ ci=Math.floor(Math.random()*pool.length); }while(used.includes(ci));
  used.push(ci);

  const correct=pool[ci];

  const wrongs=[];
  while(wrongs.length<2){
    const wi=Math.floor(Math.random()*pool.length);
    if(wi!==ci&&!wrongs.includes(wi)) wrongs.push(wi);
  }

  const opts=[correct.name,pool[wrongs[0]].name,pool[wrongs[1]].name];
  shuffle(opts);
  correctIdx=opts.indexOf(correct.name);

  qNum++;
  document.getElementById('qCounter').textContent=`שאלה ${qNum} / ${TOTAL}`;
  document.getElementById('progressFill').style.width=`${(qNum-1)/TOTAL*100}%`;

  for(let i=0;i<3;i++){
    const b=document.getElementById('btn'+i);
    b.textContent=opts[i];
    b.className='abtn';
    b.disabled=false;
  }

  placeMarker(correct.lat, correct.lng);
  locked=false;
}

function checkAnswer(idx){
  if(locked) return;
  locked=true;
  for(let i=0;i<3;i++) document.getElementById('btn'+i).disabled=true;

  const ok=idx===correctIdx;
  document.getElementById('btn'+idx).classList.add(ok?'ok':'no');
  if(!ok) document.getElementById('btn'+correctIdx).classList.add('ok');
  if(ok){ score++; document.getElementById('scoreVal').textContent=score; }

  const ov=document.getElementById('fbo');
  document.getElementById('fbe').textContent=ok
    ?['🎉','⭐','🌟','💪','🏆'][Math.floor(Math.random()*5)]:'❌';
  const ft=document.getElementById('fbt');
  ft.textContent=ok?OKP[Math.floor(Math.random()*OKP.length)]:NOP[Math.floor(Math.random()*NOP.length)];
  ft.className='fbt '+(ok?'ok':'no');
  document.getElementById('fbs').textContent=ok?'':'התשובה: '+document.getElementById('btn'+correctIdx).textContent;
  ov.classList.add('show');

  if(ok&&score%3===0) confetti();
  setTimeout(()=>{ ov.classList.remove('show'); setTimeout(nextQ,180); },1400);
}

// ═══ END ══════════════════════════════════════
function endGame(){
  const p=score/TOTAL;
  let ico,ttl,str,msg;
  if(p===1)    {ico='🏆';ttl='מושלם לחלוטין!';str='⭐⭐⭐⭐⭐';msg='תוצאה מושלמת! אתה אלוף ידיעת הארץ!'}
  else if(p>=.8){ico='🎉';ttl='כל הכבוד!';    str='⭐⭐⭐⭐';  msg='תוצאה מצוינת! אתה מכיר את ישראל יפה מאוד!'}
  else if(p>=.6){ico='😊';ttl='יפה מאוד!';    str='⭐⭐⭐';    msg='תוצאה טובה! עוד קצת אימון ותגיע למקסימום!'}
  else if(p>=.4){ico='📚';ttl='ממשיכים!';     str='⭐⭐';      msg='נסה שוב ותשפר את הציון שלך!'}
  else          {ico='💪';ttl='אל תתייאש!';   str='⭐';        msg='כל ניסיון מלמד! תנסה שוב!'}
  document.getElementById('eico').textContent=ico;
  document.getElementById('etitle').textContent=ttl;
  document.getElementById('enum').textContent=`${score}/${TOTAL}`;
  document.getElementById('estr').textContent=str;
  document.getElementById('emsg').textContent=msg;
  if(p>=.8) confetti();
  show('screen-end');
}
function restartSame(){ startGame(level); }

// ═══ UTILS ════════════════════════════════════
function shuffle(a){
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function confetti(){
  const cls=['#ff6b35','#ffd700','#4caf50','#2196f3','#e91e63','#9c27b0','#00bcd4'];
  for(let i=0;i<50;i++) setTimeout(()=>{
    const e=document.createElement('div');
    e.className='cf';
    e.style.cssText=`left:${Math.random()*100}vw;width:${7+Math.random()*7}px;height:${7+Math.random()*7}px;background:${cls[Math.floor(Math.random()*cls.length)]};border-radius:${Math.random()>.5?'50%':'3px'};animation-duration:${2.5+Math.random()*2}s;animation-delay:${Math.random()*.4}s`;
    document.body.appendChild(e);
    setTimeout(()=>e.remove(),4500);
  },i*25);
}
</script>
