      ${[["single","שיעור בודד","₪"+(t.price||0)],["package","חבילה x5","₪"+((t.price||0)*5-20)],["trial","ניסיון","₪"+Math.round((t.price||0)/2)]].map(([id,lbl,pr])=>`
        <button onclick="S.bookType='${id}';render()" style="flex:1;background:${S.bookType===id?"linear-gradient(135deg,#14B8A6,#06B6D4,#A855F7)":"rgba(20,184,166,.06)"};border:2px solid ${S.bookType===id?"transparent":"rgba(20,184,166,.1)"};border-radius:16px;padding:12px 4px;cursor:pointer;text-align:center">
          <div style="font-weight:800;font-size:13px;color:${S.bookType===id?"#fff":"#1A1A2E"}">${lbl}</div>
          <div style="font-size:12px;color:${S.bookType===id?"rgba(255,255,255,.8)":C.muted};margin-top:4px">${pr}</div>
        </button>`).join("")}
    </div>

    ${selDay&&S.bookTime?`
    <div style="background:rgba(20,184,166,0.08);border:1.5px solid rgba(20,184,166,0.3);border-radius:14px;padding:14px;margin-bottom:16px">
      <div style="font-weight:800;font-size:13px;color:#14B8A6;margin-bottom:8px">📋 בחרת:</div>
      <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px"><span style="font-weight:700">${selDay.label} ${selDay.num} ${selDay.mon}</span><span style="color:${C.muted}">תאריך</span></div>
      <div style="display:flex;justify-content:space-between;font-size:13px"><span style="font-weight:700">${S.bookTime}</span><span style="color:${C.muted}">שעה</span></div>
    </div>`:''}

    <button class="btn bs" ${!selDay||!S.bookTime?"disabled":"onclick='S.bookStep=2;render()'"}>${!selDay||!S.bookTime?"בחר תאריך ושעה":"המשך לתשלום →"}</button>`;

  if(step===2) body=`
    <!-- הסבר מודל התשלום -->
    <div style="background:linear-gradient(135deg,#0F1A1F,#1E1B4B);border-radius:20px;padding:18px;color:#fff;margin-bottom:16px">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
        <span style="font-size:28px">🛡</span>
        <div>
          <div style="font-weight:900;font-size:16px;color:#14B8A6">תשלום מאובטח דרך Kidemy</div>
          <div style="font-size:12px;color:rgba(255,255,255,0.7);margin-top:2px">הכסף אצלנו עד שהשיעור הושלם</div>
        </div>
      </div>
      <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
        <div style="background:rgba(20,184,166,0.2);border-radius:50px;padding:5px 12px;font-size:11px;font-weight:700;color:#5EEAD4">1️⃣ אתה משלם ל-Kidemy</div>
        <span style="color:rgba(255,255,255,0.4)">→</span>
        <div style="background:rgba(168,85,247,0.2);border-radius:50px;padding:5px 12px;font-size:11px;font-weight:700;color:#C4B5FD">2️⃣ השיעור מתקיים</div>
        <span style="color:rgba(255,255,255,0.4)">→</span>
        <div style="background:rgba(251,191,36,0.2);border-radius:50px;padding:5px 12px;font-size:11px;font-weight:700;color:#FDE68A">3️⃣ Kidemy מעביר למורה</div>
      </div>
    </div>

    <!-- סיכום הזמנה -->
    <div style="background:rgba(20,184,166,.06);border:1.5px solid rgba(20,184,166,.2);border-radius:16px;padding:16px;margin-bottom:16px">
      <h4 style="font-weight:900;font-size:14px;margin:0 0 10px;color:#14B8A6">📋 פרטי ההזמנה</h4>
      <div style="display:flex;justify-content:space-between;margin-bottom:6px;font-size:13px"><span style="font-weight:700">${t.name}</span><span style="color:${C.muted}">מורה</span></div>
      <div style="display:flex;justify-content:space-between;margin-bottom:6px;font-size:13px"><span style="font-weight:700">${selDay?.label||''} ${selDay?.num||''} ${selDay?.mon||''} – ${S.bookTime}</span><span style="color:${C.muted}">מועד</span></div>
      <div style="height:1px;background:rgba(20,184,166,.15);margin:10px 0"></div>
      <div style="display:flex;justify-content:space-between"><span style="font-weight:900;font-size:16px">לתשלום ל-Kidemy</span><span style="font-weight:900;font-size:20px;color:#14B8A6">₪${price}</span></div>
    </div>

    <h3 style="font-weight:900;font-size:16px;margin:0 0 12px">בחר אמצעי תשלום:</h3>

    <!-- Bit -->
    <div class="pay-m ${S.bookPay==='bit'?"on":""}" onclick="S.bookPay='bit';render()" style="border-color:${S.bookPay==='bit'?'#A855F7':'rgba(20,184,166,.1)'};background:${S.bookPay==='bit'?'rgba(168,85,247,0.1)':'rgba(255,255,255,0.7)'}">
      <div style="font-size:30px;width:48px;height:48px;border-radius:14px;background:rgba(168,85,247,0.15);display:flex;align-items:center;justify-content:center;flex-shrink:0">💜</div>

        <div style="font-weight:800;font-size:15px;color:#A855F7">Bit</div>
        <div style="font-size:12px;color:${C.muted}">שלח ל: ${ADMIN_PAYMENT.bit} (Kidemy)</div>

      ${S.bookPay==='bit'?`<div style="margin-right:auto;width:24px;height:24px;border-radius:50%;background:#A855F7;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px">✓</div>`:""}

function toggleLike(id){
  const p=S.posts.find(x=>x.id===id);
  if(!p||!currentUser)return;
  const wasLiked=p.likedBy&&p.likedBy[currentUser.uid];
  if(wasLiked){
    delete p.likedBy[currentUser.uid];
    p.likes=Math.max(0,(p.likes||0)-1);
    p.liked=false;
  } else {
    if(!p.likedBy)p.likedBy={};
    p.likedBy[currentUser.uid]=true;
    p.likes=(p.likes||0)+1;
    p.liked=true;
  }
  db.ref('communityPosts/'+id+'/likes').set(p.likes);
  db.ref('communityPosts/'+id+'/likedBy/'+currentUser.uid).set(wasLiked?null:true);
  render();
}

function openPost(id){S.openPost=S.openPost===id?null:id;render();}

async function sendReply(id){
  const inp=document.getElementById("rp_"+id);
  if(!inp||!inp.value.trim()||!currentUser)return;
  const text=inp.value.trim();
  inp.value="";
  const p=S.posts.find(x=>x.id===id);
  if(!p)return;
  const reply={
    av:"😊",
    auth:currentUserData?.name||currentUser.email.split('@')[0],
    authUid:currentUser.uid,
    text,
    createdAt:Date.now()
  };
  if(!p.reps)p.reps=[];
  p.reps.push(reply);
  try{
    await db.ref('communityPosts/'+id+'/reps').push(reply);
  }catch(e){}
  render();
}

async function postNew(){
  const t=document.getElementById("ptxt");
  if(!t||!t.value.trim()){showFireToast('❌ כתוב משהו');return;}
  if(!currentUser){showFireToast('❌ צריך להתחבר');return;}
  const userName=currentUserData?.name||currentUser.email.split('@')[0]||"אורח";
  const post={
    author:userName,
    authUid:currentUser.uid,
    av:currentUserData?.photo?'📸':"😊",
    photo:currentUserData?.photo||null,
    col:'#14B8A6',
    role:currentUserData?.role==='teacher'?"מורה":"תלמיד",
    area:currentUserData?.area||currentUserData?.city||'',
    pcat:S.newPostCat||"general",
    text:t.value.trim(),
    likes:0,
    likedBy:{},
    reps:[],
    createdAt:Date.now()
  };
  try{
    showFireToast('⏳ מפרסם...');
    const ref=db.ref('communityPosts').push();
    await ref.set(post);
    post.id=ref.key;
    post.time='עכשיו';
    S.posts.unshift(post);
    S.showCompose=false;
    showFireToast('✅ פורסם!');
    render();
  }catch(e){
    console.error('Post error:',e);
    if(e.code==='PERMISSION_DENIED'||String(e.message).includes('PERMISSION_DENIED')){
      showFireToast('❌ שגיאת הרשאות – עדכן Firebase Rules');
      post.id='local_'+Date.now();
      post.time='עכשיו';
      S.posts.unshift(post);
      S.showCompose=false;
      render();
    } else {
      showFireToast('❌ שגיאה: '+e.message);
    }
  }
}

let postsListener=null;
async function loadCommunityPosts(){
  try{
    // בלי orderByChild - לא דורש index ב-Firebase Rules
    const snap=await db.ref('communityPosts').limitToLast(50).get();
    S.posts=[];
    if(snap.exists()){
      snap.forEach(c=>{
        const p={id:c.key,...c.val()};
        if(p.reps&&typeof p.reps==='object'&&!Array.isArray(p.reps)){
          p.reps=Object.values(p.reps);
        }
        if(!p.reps)p.reps=[];
        const ago=Math.round((Date.now()-(p.createdAt||0))/60000);
        p.time=ago<1?'עכשיו':ago<60?ago+' דק\'':ago<1440?Math.floor(ago/60)+' שע\'':Math.floor(ago/1440)+' ימים';
        p.liked=currentUser&&p.likedBy&&p.likedBy[currentUser.uid];
        S.posts.push(p);
      });
      // מיון לפי זמן - חדש למעלה
      S.posts.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    }
    postsLoaded=true;
    render();
  }catch(e){
    console.warn('Load posts error:',e);
    postsLoaded=true;
    render();
  }
}

async function deleteMyPost(id){
  if(!confirm('למחוק את הפוסט?'))return;
  try{
    await db.ref('communityPosts/'+id).remove();
    S.posts=S.posts.filter(p=>p.id!==id);
    showFireToast('🗑 נמחק');
    render();
  }catch(e){showFireToast('❌ '+e.message);}
}

async function saveProfileEdits(){
  const name=document.getElementById('_epName')?.value.trim();
  const age=document.getElementById('_epAge')?.value;
  const city=document.getElementById('_epCity')?.value.trim();
  const bio=document.getElementById('_epBio')?.value.trim();
  if(!name){showFireToast('❌ שם לא יכול להיות ריק');return;}
  try{
    const updates={};
    if(name)updates.name=name;
    if(age)updates.age=parseInt(age);
    if(city!==undefined)updates.city=city;
    if(bio!==undefined)updates.bio=bio;
    await db.ref('users/'+currentUser.uid).update(updates);
    if(currentUserData)Object.assign(currentUserData,updates);
    document.querySelector('div[style*=fixed]')?.remove();
    showFireToast('✅ הפרופיל עודכן!');
    render();
  }catch(e){showFireToast('❌ '+e.message);}
}

function toggleEtCat(btn,catId){
  const idx=window._etCats.indexOf(catId);
  if(idx>-1){
    window._etCats.splice(idx,1);
    btn.style.background='rgba(20,184,166,0.07)';
    btn.style.borderColor='rgba(20,184,166,0.2)';
    btn.style.color='#0F1A1F';
    btn.innerHTML=btn.innerHTML.replace(' ✓','');
  }else{
    window._etCats.push(catId);
    btn.style.background='linear-gradient(135deg,#14B8A6,#06B6D4)';
    btn.style.borderColor='transparent';
    btn.style.color='#fff';
    if(!btn.innerHTML.includes(' ✓'))btn.innerHTML+=' ✓';
  }
}
function addEtCustomCat(){
  const inp=document.getElementById('_etCustomInp');
  const val=inp?.value.trim();
  if(!val){showFireToast('❌ הכנס שם מקצוע');return;}
  if(window._etCustomCats.includes(val)){showFireToast('כבר קיים');return;}
  window._etCustomCats.push(val);
  inp.value='';
  const container=document.getElementById('_etCustomList');
  if(container){
    const tag=document.createElement('span');
    tag.style.cssText='background:rgba(168,85,247,0.15);border:1px solid rgba(168,85,247,0.3);border-radius:50px;padding:5px 12px;font-size:12px;font-weight:700;color:#A855F7;display:inline-flex;align-items:center;gap:6px';
    tag.innerHTML=`✨ ${val} <span onclick="removeEtCustomCat('${val}',this)" style="color:#EF4444;font-weight:900;cursor:pointer">✕</span>`;
    container.appendChild(tag);
  }
}
function removeEtCustomCat(val,el){
  window._etCustomCats=(window._etCustomCats||[]).filter(c=>c!==val);
  el.closest('span').remove();
}

async function saveCatProfileEdits(catId){
  const desc=document.getElementById('_ecDesc')?.value.trim();
  const tagsRaw=document.getElementById('_ecTags')?.value.trim();
  const tags=tagsRaw?tagsRaw.split(',').map(s=>s.trim()).filter(Boolean):[];
  try{
    await db.ref(`teachers/${currentUser.uid}/catProfiles/${catId}`).set({desc:desc||'',tags});
    const t=TEACHERS.find(x=>x.id===currentUser.uid);
    if(t){if(!t.catProfiles)t.catProfiles={};t.catProfiles[catId]={desc:desc||'',tags};}
    document.querySelector('div[style*=fixed]')?.remove();
    showFireToast('✅ פרופיל '+catId+' עודכן!');
    render();
  }catch(e){showFireToast('❌ '+e.message);}
}
async function saveTeacherProfileEdits(){
  const name=document.getElementById('_etName')?.value.trim();
  const age=parseInt(document.getElementById('_etAge')?.value)||0;
  const bio=document.getElementById('_etBio')?.value.trim();
  const desc=document.getElementById('_etDesc')?.value.trim();
  const price=parseInt(document.getElementById('_etPrice')?.value)||0;
  const city=document.getElementById('_etCity')?.value.trim();
  const tagsRaw=document.getElementById('_etTags')?.value.trim();
  const tags=tagsRaw?tagsRaw.split(',').map(s=>s.trim()).filter(Boolean):[];
  const cats=(window._etCats&&window._etCats.length)?window._etCats:(TEACHERS.find(x=>x.id===currentUser?.uid)?.cats||[]);
  const customCats=window._etCustomCats||[];
  const allCats=[...cats,...customCats.map(c=>'custom:'+c)];
  if(!name){showFireToast('❌ שם לא יכול להיות ריק');return;}
  if(!desc){showFireToast('❌ תיאור לא יכול להיות ריק');return;}
  if(price<10||price>500){showFireToast('❌ מחיר בין 10 ל-500');return;}
  if(!allCats.length){showFireToast('❌ חייב לפחות מקצוע אחד');return;}
  try{
    // עדכן פרטי משתמש בסיסיים
    const userUpdates={name};
    if(age)userUpdates.age=age;
    if(bio!==undefined)userUpdates.bio=bio;
    if(city)userUpdates.city=city;
    await db.ref('users/'+currentUser.uid).update(userUpdates);
    if(currentUserData)Object.assign(currentUserData,userUpdates);
    // עדכן פרופיל מורה
    const teacherUpdates={desc,price,city,tags,cats:allCats,cat:allCats[0],customCats,name};
    await db.ref('teachers/'+currentUser.uid).update(teacherUpdates);
    for(const cc of customCats){
      await db.ref('pendingCategories').push({teacherId:currentUser.uid,teacherName:name,category:cc,createdAt:Date.now(),status:'pending'}).catch(()=>{});
    }
    const t=TEACHERS.find(x=>x.id===currentUser.uid);
    if(t)Object.assign(t,teacherUpdates);
    document.getElementById('_etOv')?.remove();
    showFireToast('✅ הפרופיל עודכן!');
    render();
  }catch(e){showFireToast('❌ '+e.message);}
}

// ─── PULL-TO-REFRESH ─────────────────────────────────────────────────────────
(function(){
  let _ptStart=null,_ptEl=null,_ptRefreshing=false;
  const THRESHOLD=75;
  function _getAppEl(){return document.getElementById('app');}
  function _mkIndicator(){
    const d=document.createElement('div');
    d.id='_ptrInd';
    d.style.cssText='position:fixed;top:0;left:50%;transform:translateX(-50%) translateY(-60px);z-index:99998;pointer-events:none;transition:transform 0.18s,opacity 0.18s;opacity:0;display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,#14B8A6,#A855F7);color:#fff;border-radius:50px;padding:8px 20px;font-size:13px;font-weight:800;box-shadow:0 4px 18px rgba(20,184,166,0.4);white-space:nowrap';
    d.innerHTML='<span id="_ptrSpinner" style="display:inline-block;font-size:16px">↓</span> <span id="_ptrTxt">משוך לרענון</span>';
    document.body.appendChild(d);
    return d;
  }
  function _update(dy){
    if(!_ptEl)_ptEl=_mkIndicator();
    const prog=Math.min(dy/THRESHOLD,1);
    const translateY=Math.min(dy*0.55,52)-60;
    _ptEl.style.transform=`translateX(-50%) translateY(${translateY}px)`;
    _ptEl.style.opacity=prog;
    const txt=document.getElementById('_ptrTxt');
    if(txt)txt.textContent=prog>=1?'שחרר לרענון ✨':'משוך לרענון';
    const sp=document.getElementById('_ptrSpinner');
    if(sp)sp.style.transform=`rotate(${prog*180}deg)`;
  }
  function _dismiss(){
    if(_ptEl){_ptEl.style.opacity='0';_ptEl.style.transform='translateX(-50%) translateY(-60px)';setTimeout(()=>{_ptEl?.remove();_ptEl=null;},300);}
  }
  async function _doRefresh(){
    _ptRefreshing=true;
    if(_ptEl){
      const sp=document.getElementById('_ptrSpinner');
      const txt=document.getElementById('_ptrTxt');
      if(sp)sp.innerHTML='<span style="display:inline-block;animation:spin 0.8s linear infinite">⟳</span>';
      if(txt)txt.textContent='מרענן...';
      _ptEl.style.transform='translateX(-50%) translateY(-4px)';
      _ptEl.style.opacity='1';
    }
    await loadRealTeachers();
    render();
    showFireToast('✅ עודכן!');
    _dismiss();
    _ptRefreshing=false;
  }
  const app=_getAppEl()||document.body;
  app.addEventListener('touchstart',e=>{
    if(_ptRefreshing)return;
    const el=_getAppEl()||document.body;
    if(el.scrollTop===0)_ptStart=e.touches[0].clientY;
  },{passive:true});
  app.addEventListener('touchmove',e=>{
    if(_ptStart===null||_ptRefreshing)return;
    const dy=e.touches[0].clientY-_ptStart;
    if(dy>8)_update(dy);
  },{passive:true});
  app.addEventListener('touchend',e=>{
    if(_ptStart===null||_ptRefreshing)return;
    const dy=e.changedTouches[0].clientY-_ptStart;
    _ptStart=null;
    if(dy>=THRESHOLD)_doRefresh();
    else _dismiss();
  });
  // הוסף animation לספינר
  if(!document.getElementById('_ptrStyle')){
    const s=document.createElement('style');
    s.id='_ptrStyle';
    s.textContent='@keyframes spin{to{transform:rotate(360deg)}}';
    document.head.appendChild(s);
  }
})();

function openWhatsApp(phone,message){
  // ניקוי מספר טלפון - הסרת רווחים, מקפים, סוגריים
  let cleaned=(phone||'').replace(/[\s\-\(\)\+]/g,'');
  // אם מתחיל ב-0 - מחליף ל-972 (קוד ישראל)
  if(cleaned.startsWith('0'))cleaned='972'+cleaned.substring(1);
  // אם לא מתחיל ב-972, נוסיף
  if(!cleaned.startsWith('972')&&cleaned.length===9)cleaned='972'+cleaned;
  const text=encodeURIComponent(message||'');
  const url=`https://wa.me/${cleaned}?text=${text}`;
  window.open(url,'_blank');
}

let currentUser=null, currentUserData=null;

auth.onAuthStateChanged(async user=>{
  loadRealTeachers();
  if(user){
    // בדוק אם המשתמש נחסם על ידי מנהל
    if(!S._registering){
      try{
        const bannedSnap=await db.ref('bannedUsers/'+user.uid).get();
        if(bannedSnap.exists()){
          try{await user.delete();}catch(e2){}
          await auth.signOut().catch(()=>{});
          currentUser=null;currentUserData=null;
          showFireToast('❌ חשבון זה הוסר מהמערכת');
          go('login');return;
        }
      }catch(e2){}
      // האזן לניתוק כפוי (admin מחק בזמן שמשתמש מחובר)
      db.ref('forceSignout/'+user.uid).on('value',async snap=>{
        if(snap.exists()&&snap.val()?.ts){
          db.ref('forceSignout/'+user.uid).off('value');
          try{await auth.currentUser?.delete();}catch(e2){}
          await auth.signOut().catch(()=>{});
          currentUser=null;currentUserData=null;
          showFireToast('❌ חשבון זה הוסר מהמערכת');
          go('login');
        }
      });
    }
    currentUser=user;
    try{
      const snap=await db.ref('users/'+user.uid).get();
      if(snap.exists())currentUserData=snap.val();

      // ── בדיקת מורה שלא אושר עדיין ──────────────────────────────
      if(currentUserData?.role==='teacher'){
        const tSnap=await db.ref('teachers/'+user.uid).get();
        if(!tSnap.exists()){
          // מנהל חייב להשלים פרופיל מורה — לא ניתן לדלג
          if(!S.skippedSetup||isAdmin()){go('teacherSetup');return;}
          // שאר המורים שדילגו — המשך ללא פרופיל
        } else {
          const tData=tSnap.val();
          if(!tData.verified&&!isAdmin()){
            S.pendingTeacherData=tData;
            go('teacherPending');return;
          }
          await loadTeacherBookings();
        }
      }

      await loadStudentBookings();
      await loadParentChildren();
      await loadFavorites();
      await loadNotifications();
      await loadUserChats();
      if(currentUserData?.role==='teacher')await loadTeacherAnalytics();
      if(currentUserData?.role==='teacher')await loadTeacherVideos();

      // האזנה בזמן אמת להתראות + לאישור מנהל
      if(isAdmin())_requestBrowserNotifPermission();
      db.ref('notifications/'+user.uid).on('child_added',snap=>{
        const n=snap.val();
        if(n&&!n.read)_sendBrowserNotif(
          n.type==='newBooking'?'📚 הזמנת שיעור חדשה!':'🔔 התראה חדשה',
          n.type==='newBooking'?`${n.from||''} · יום ${n.day||''} ${n.time||''}`:(n.from||''));
        loadNotifications().then(()=>{if(S.screen)render();});
      });
      // האזנה ל-adminNotifs (מורים חדשים, סרטונים, משתמשים) – ללא חיפוש UID
      if(isAdmin()){
        db.ref('adminNotifs').on('child_added',snap=>{
          const n=snap.val();
          if(n&&!n.read){
            if(n.type==='newTeacher')_sendBrowserNotif('🎓 מורה חדש נרשם!',`${n.from||''} · ${n.teacherEmail||''}`);
            else if(n.type==='newVideo')_sendBrowserNotif('📹 סרטון חדש ממתין',n.from||'');
            else if(n.type==='newUser')_sendBrowserNotif('👋 משתמש חדש',`${n.from||''} · ${n.userEmail||''}`);
          }
          loadNotifications().then(()=>{if(S.screen)render();});
        });
      }

      // האזנה לשינוי אישור מנהל (מורה ממתין)
      if(currentUserData?.role==='teacher'){
        db.ref('teachers/'+user.uid+'/verified').on('value',snap=>{
          if(snap.val()===true&&S.screen==='teacherPending'){
            showFireToast('🎉 הפרופיל שלך אושר! ברוך הבא!');
            go('home');
          }
        });
      }

    }catch(e){console.warn('Auth error:',e);}
    if(S.screen==='splash'||S.screen==='login'){go('home');}
    else render();
  } else {currentUser=null;currentUserData=null;teacherPendingBookings=[];studentBookings=[];}
});

async function firebaseRegister(email,password,userData){
  try{
    showFireToast('⏳ יוצר חשבון...');
    S._registering=true;
    const cred=await auth.createUserWithEmailAndPassword(email,password);
    // שמירת פרטים ב-Database
    await db.ref('users/'+cred.user.uid).set({
      ...userData,
      email,
      uid:cred.user.uid,
      createdAt:Date.now(),
      verified:false,
      role:userData.role||'student'
    });
    // שליחת מייל אימות + מייל ברכה למשתמש
    try{
      await cred.user.sendEmailVerification({
        url: window.location.origin,
        handleCodeInApp: false
      });
    }catch(emailErr){
      console.warn('Email verification failed:',emailErr);
    }
    // מייל ברכה אישי למשתמש
    await sendWelcomeEmail(email, userData.name||email.split('@')[0], userData.role||'student');
    // מייל להורה על הצטרפות הילד
    if(userData.parentEmail){
      const roleHe=(userData.role||'student')==='teacher'?'מורה':'תלמיד/ה';
      sendEmail(userData.parentEmail,`אישור הצטרפות ל-Kidemy – ${userData.name||''}`,
        `שלום ${userData.parentName||'הורה יקר'},\n\nילדך ${userData.name||''} נרשם/ה בהצלחה ל-Kidemy כ${roleHe}.\n\nתוכלו לעקוב אחרי כל הפעילות שלו/ה באפליקציה.\n\nבכל שאלה – פנו למנהל האפליקציה: ${ADMIN_EMAIL}\n\n– צוות Kidemy`);
    }
    // עדכון currentUserData מיד
    currentUserData={...userData,email,uid:cred.user.uid,role:userData.role||'student'};
    // התראה למנהל על משתמש/מורה חדש
    try{
      const roleHe=(userData.role||'student')==='teacher'?'מורה':'תלמיד/ה';
      const isTeacher=(userData.role||'student')==='teacher';
      await notifyAdmin({
        type: isTeacher?'newTeacher':'newUser',
        from: userData.name||email,
        userEmail: email,
        teacherEmail: isTeacher?email:undefined,
        teacherId: isTeacher?cred.user.uid:undefined,
        parentName: userData.parentName||'',
        parentEmail: userData.parentEmail||'',
        profileComplete: false,
      });
      sendAdminEmail(`${isTeacher?'🎓 מורה':'👤 תלמיד/ה'} חדש/ה נרשם/ה – ${userData.name||email}`,
        `שם: ${userData.name||'—'}\nמייל: ${email}\nתפקיד: ${roleHe}\n${userData.parentName?'הורה: '+userData.parentName+' ('+userData.parentEmail+')':''}\n${isTeacher?'⚠️ עדיין לא השלים/ה פרופיל מורה\n':''}\nזמן: ${new Date().toLocaleString('he-IL')}`);
    }catch(e){console.warn('Admin notif failed:',e);}
    // נקה את סשן ההרשמה – הרשמה הסתיימה
    try{
      sessionStorage.removeItem('_kidReg');
      sessionStorage.removeItem('_rName');
      sessionStorage.removeItem('_rAge');
      sessionStorage.removeItem('_rEmail');
    }catch(e){}
    S.safetyConfirmed=false;S.parentRegData=null;
    S._registering=false;
    // מציג מסך הצלחה במקום ה-render הרגיל
    S.screen='regSuccess';
    S.regEmail=email;
    render();
  }catch(e){
    S._registering=false;
    if(e.code==='auth/email-already-in-use'){
      // בדוק אם המייל שייך לחשבון שנמחק/נחסם — אם כן, מאפשרים הרשמה מחדש
      try{
        const sc=await auth.signInWithEmailAndPassword(email,password);
        const bannedSnap=await db.ref('bannedUsers/'+sc.user.uid).get();
        if(bannedSnap.exists()){
          await sc.user.delete();
          await db.ref('bannedUsers/'+sc.user.uid).remove().catch(()=>{});
          return await firebaseRegister(email,password,userData);
        }else{
          await auth.signOut().catch(()=>{});
          showFireToast('❌ המייל כבר קיים במערכת - נסה מייל אחר');
        }
      }catch(signInErr){
        showFireToast('❌ המייל כבר קיים במערכת - נסה מייל אחר');
      }
      return;
    }
    const m={
      'auth/weak-password':'❌ סיסמה חלשה מדי – לפחות 6 תווים',
      'auth/invalid-email':'❌ כתובת מייל לא תקינה',
      'auth/network-request-failed':'❌ אין חיבור לאינטרנט'
    };
    showFireToast(m[e.code]||'❌ '+e.message);
  }
}
