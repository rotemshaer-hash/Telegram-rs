name: Deploy Firebase Rules

on:
  # ידני, כדי שאפשר יהיה לאמת שינוי הרשאות בלי לגעת בקובץ חוקים רק כדי
  # לגרום ל-push. בלי זה, הדרך היחידה לבדוק אם פריסת ה-storage השתחררה
  # היא לערוך קובץ שלא צריך לערוך.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'database.rules.json'
      - 'storage.rules'
      - 'firebase.json'

jobs:
  # 85 טסטים נכתבו כדי להגן על database.rules.json — ועד עכשיו הם לא שמרו
  # עליו בדרך לייצור: ה-workflow הזה פרס את הקובץ לפיירבייס האמיתי בלי
  # להריץ אף אחד מהם. רגרסיה בחוקים שמוזגה ל-main הייתה עולה לייצור, והיחיד
  # שהיה תופס אותה הוא ה-job על ענף הפיצ'ר — כלומר *לפני* המיזוג, ורק אם
  # מישהו הסתכל. עכשיו הפריסה נחסמת.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - run: npm ci
      - name: Run security rules tests
        run: npm run test:rules

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install -g firebase-tools
      - name: Write service account credentials
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: echo "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/sa.json

      # database ו-storage היו פריסה אחת (--only database,storage). firebase
      # מריץ אותן בסדר, ו-storage נכשל ב-403 על serviceusage.services.get —
      # מה שהפיל את כל הפקודה *אחרי* שחוקי ה-database כבר עברו ולידציה אך
      # לפני שנשמרו. התוצאה: כל פריסת חוקים נכשלה בגלל הרשאה חסרה ביעד אחר,
      # ולכן החוקים פורסמו ידנית בקונסולה במשך חודשים.
      # הפרדה לשני שלבים מנתקת את התלות: חוקי ה-database נפרסים תמיד.
      - name: Deploy database rules
        run: GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json firebase deploy --only database --project kidemy-83a17 --non-interactive

      # ── חוסם, סוף סוף ──
      #
      # השלב הזה נפל חודשים על 403 והיה מוגדר כאזהרה. הסיפור המלא ב-HANDOFF;
      # מה שחשוב כאן הוא השורש, שהתברר רק אחרי שנשאל ישירות דרך
      # testIamPermissions במקום להיות מוסק מהכישלון:
      #
      #   firebaserules.releases.update   ✅ יש
      #   firebaserules.rulesets.create   ✅ יש
      #   firebaserules.rulesets.test     ❌ אין
      #
      # ‏`rulesets.test` היא בדיקת התחביר שה-CLI מריץ **לפני** הפריסה, ואינה
      # נדרשת לפריסה עצמה. כלומר לחשבון היו כל ההרשאות שצריך, והוא נחסם על
      # ידי צעד אימות שאינו רשאי להריץ. חודשים של הענקת תפקידים רדפו אחרי
      # הדבר הלא נכון.
      #
      # deploy-storage-rules.js מדבר ישירות עם ה-API ומשתמש רק בשתי ההרשאות
      # שקיימות. הוא משווה תוכן לפני שהוא כותב, ומאמת בקריאה חוזרת אחרי.
      #
      # ואימות התחביר לא אבד — הוא עבר מקום: job ה-test שמעל מריץ 34 טסטים
      # מול אמולטור Storage אמיתי, ובודק התנהגות ולא תחביר.
      - name: Install script dependencies
        working-directory: scripts
        run: npm install

      - name: Deploy storage rules
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node deploy-storage-rules.js
