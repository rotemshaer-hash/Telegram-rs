name: Deploy Firebase Rules

on:
  # ידני, כדי שאפשר יהיה לאמת שינוי הרשאות בלי לגעת בקובץ חוקים רק כדי
  # לגרום ל-push. בלי זה, הדרך היחידה לבדוק אם פריסת ה-storage השתחררה
  # היא לערוך קובץ שלא צריך לערוך.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'database.rules.json'
      - 'storage.rules'
      - 'firebase.json'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install -g firebase-tools
      - name: Write service account credentials
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: echo "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/sa.json

      # database ו-storage היו פריסה אחת (--only database,storage). firebase
      # מריץ אותן בסדר, ו-storage נכשל ב-403 על serviceusage.services.get —
      # מה שהפיל את כל הפקודה *אחרי* שחוקי ה-database כבר עברו ולידציה אך
      # לפני שנשמרו. התוצאה: כל פריסת חוקים נכשלה בגלל הרשאה חסרה ביעד אחר,
      # ולכן החוקים פורסמו ידנית בקונסולה במשך חודשים.
      # הפרדה לשני שלבים מנתקת את התלות: חוקי ה-database נפרסים תמיד.
      - name: Deploy database rules
        run: GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json firebase deploy --only database --project kidemy-83a17 --non-interactive

      # שתי הסיבות שכבר הפילו את השלב הזה בפועל, לפי הסדר שהתגלו. הודעה
      # שמפנה להרשאה שכבר הוענקה שולחת את הקורא הבא לתקן דבר תקין, ולכן
      # ההודעה מונה את שתיהן ומסבירה איך להבדיל.
      - name: Deploy storage rules
        run: |
          if ! GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json firebase deploy --only storage --project kidemy-83a17 --non-interactive; then
            echo "::error::Storage rules were not deployed — database rules above already were. Check the error just above: (1) 'Permission denied to get service' means the service account in FIREBASE_SERVICE_ACCOUNT lacks roles/serviceusage.serviceUsageConsumer — grant it at https://console.cloud.google.com/iam-admin/iam?project=kidemy-83a17 ; (2) 'Permissions denied enabling firebasestorage.googleapis.com' means the API itself is off — a project owner enables it once at https://console.cloud.google.com/apis/library/firebasestorage.googleapis.com?project=kidemy-83a17"
            exit 1
          fi
