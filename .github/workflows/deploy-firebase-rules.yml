name: Deploy Firebase Rules

on:
  push:
    branches: [main]
    paths:
      - 'database.rules.json'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install -g firebase-tools
      - run: firebase deploy --only database --project kidemy-83a17 --token "${{ secrets.FIREBASE_TOKEN }}" --non-interactive
