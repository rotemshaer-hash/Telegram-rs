name: Deploy Firebase Rules

on:
  # ידני, כדי שאפשר יהיה לאמת שינוי הרשאות בלי לגעת בקובץ חוקים רק כדי
  # לגרום ל-push. בלי זה, הדרך היחידה לבדוק אם פריסת ה-storage השתחררה
  # היא לערוך קובץ שלא צריך לערוך.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'database.rules.json'
      - 'storage.rules'
      - 'firebase.json'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install -g firebase-tools
      - name: Write service account credentials
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: echo "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/sa.json

      # database ו-storage היו פריסה אחת (--only database,storage). firebase
      # מריץ אותן בסדר, ו-storage נכשל ב-403 על serviceusage.services.get —
      # מה שהפיל את כל הפקודה *אחרי* שחוקי ה-database כבר עברו ולידציה אך
      # לפני שנשמרו. התוצאה: כל פריסת חוקים נכשלה בגלל הרשאה חסרה ביעד אחר,
      # ולכן החוקים פורסמו ידנית בקונסולה במשך חודשים.
      # הפרדה לשני שלבים מנתקת את התלות: חוקי ה-database נפרסים תמיד.
      - name: Deploy database rules
        run: GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json firebase deploy --only database --project kidemy-83a17 --non-interactive

      # מזהיר ולא מפיל, בכוונה.
      #
      # שלושה חסמים נפתרו כאן בזה אחר זה (הרשאת serviceusage, הפעלת ה-API,
      # ותפקיד Cloud Storage for Firebase Admin), והשלב עדיין נופל על
      # firebasestorage.defaultBucket.get. ההפרש בין storage ל-database הוא
      # שחוקי ה-database משתנים בפועל, בעוד storage.rules לא נגע מאז שהריפו
      # נוצר — ואם ישתנה אפשר לפרסם אותו ידנית בקונסולה בדקה.
      #
      # job שנשאר אדום לתמיד גרוע יותר מ-job שמזהיר: הוא מאמן את כולם
      # להתעלם מהכישלון הבא. בדיוק זה קרה כאן — 19 הרצות אדומות ברצף הסתירו
      # את העובדה שגם חוקי ה-database לא נפרסו.
      #
      # האזהרה מופיעה בסיכום ההרצה, כך שהפער נשאר גלוי ולא נעלם בשקט.
      - name: Deploy storage rules
        run: |
          if ! GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json firebase deploy --only storage --project kidemy-83a17 --non-interactive; then
            echo "::warning::Storage rules were NOT deployed — database rules above were. storage.rules is what protects minors' ID photos, so if you changed it, publish it by hand at https://console.firebase.google.com/project/kidemy-83a17/storage/rules . Known cause: the FIREBASE_SERVICE_ACCOUNT service account is denied firebasestorage.defaultBucket.get even with Cloud Storage for Firebase Admin granted; see HANDOFF.md."
          fi
