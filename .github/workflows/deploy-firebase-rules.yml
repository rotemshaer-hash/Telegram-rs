name: Deploy Firebase Rules

on:
  # ידני, כדי שאפשר יהיה לאמת שינוי הרשאות בלי לגעת בקובץ חוקים רק כדי
  # לגרום ל-push. בלי זה, הדרך היחידה לבדוק אם פריסת ה-storage השתחררה
  # היא לערוך קובץ שלא צריך לערוך.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'database.rules.json'
      - 'storage.rules'
      - 'firebase.json'

jobs:
  # 85 טסטים נכתבו כדי להגן על database.rules.json — ועד עכשיו הם לא שמרו
  # עליו בדרך לייצור: ה-workflow הזה פרס את הקובץ לפיירבייס האמיתי בלי
  # להריץ אף אחד מהם. רגרסיה בחוקים שמוזגה ל-main הייתה עולה לייצור, והיחיד
  # שהיה תופס אותה הוא ה-job על ענף הפיצ'ר — כלומר *לפני* המיזוג, ורק אם
  # מישהו הסתכל. עכשיו הפריסה נחסמת.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - run: npm ci
      - name: Run security rules tests
        run: npm run test:rules

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install -g firebase-tools
      - name: Write service account credentials
        env:
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: echo "$GOOGLE_APPLICATION_CREDENTIALS_JSON" > /tmp/sa.json

      # database ו-storage היו פריסה אחת (--only database,storage). firebase
      # מריץ אותן בסדר, ו-storage נכשל ב-403 על serviceusage.services.get —
      # מה שהפיל את כל הפקודה *אחרי* שחוקי ה-database כבר עברו ולידציה אך
      # לפני שנשמרו. התוצאה: כל פריסת חוקים נכשלה בגלל הרשאה חסרה ביעד אחר,
      # ולכן החוקים פורסמו ידנית בקונסולה במשך חודשים.
      # הפרדה לשני שלבים מנתקת את התלות: חוקי ה-database נפרסים תמיד.
      - name: Deploy database rules
        run: GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json firebase deploy --only database --project kidemy-83a17 --non-interactive

      # עדיין מזהיר ולא מפיל — ובכוונה, בשלב הזה בלבד.
      #
      # ההיסטוריה: השלב נפל חודשים על 403, והוענקו שלוש הרשאות IAM שונות
      # כדי לפתור אותו. אף אחת לא עזרה — כי זו לא הייתה בעיית הרשאות אלא
      # ש-Firebase Storage מעולם לא הופעל בפרויקט. השגיאה אמרה את זה כל
      # הזמן במילים "or it may not exist". ב-7.9.2026 הבעלים לחץ
      # "Get started" ושדרג ל-Blaze, והשגיאה אכן זזה — עכשיו היא 403 על
      # firebaserules.googleapis.com/:test, כלומר לחשבון השירות של ה-CI
      # חסרה ההרשאה firebaserules.rulesets.test.
      #
      # למה זה עדיין לא חוסם: החשבון שה-workflow משתמש בו הוא הסוד
      # FIREBASE_SERVICE_ACCOUNT, ואינו בהכרח אותו חשבון שמופיע ב-
      # netlify/lib/firebase-admin-init.js. כל עוד לא אומת איזה חשבון זה
      # ושהוענקה לו ההרשאה, hard-fail היה חוסם גם את פריסת חוקי ה-database
      # — שעובדת מצוין — בגלל יעד אחר. זה בדיוק הכשל שההפרדה לשני שלבים
      # נועדה למנוע מלכתחילה.
      #
      # ⬜ להפוך לחוסם ברגע שהרצה אחת עוברת. זה שורה אחת: להסיר את העטיפה.
      - name: Deploy storage rules
        run: |
          if ! GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json firebase deploy --only storage --project kidemy-83a17 --non-interactive; then
            echo "::warning::Storage rules were NOT deployed — database rules above were. Publish by hand at https://console.firebase.google.com/project/kidemy-83a17/storage/rules . Current cause: the CI service account (secret FIREBASE_SERVICE_ACCOUNT) lacks firebaserules.rulesets.test — grant it Firebase Rules Admin in Google Cloud IAM."
          fi
