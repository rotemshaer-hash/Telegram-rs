name: Build Android App

on:
  workflow_dispatch:
  push:
    # ענפי claude/** בונים אוטומטית כדי שאפשר יהיה לאמת שינוי נייטיב מיד
    # אחרי push, בלי שמישהו יצטרך לבחור ענף ידנית ב-Run workflow — בחירה
    # שקל לפספס, ואז הבנייה רצה על main ובודקת קוד אחר לגמרי.
    branches:
      - main
      - 'claude/**'
    paths:
      - 'mobile/**'
      - '.github/workflows/build-android.yml'
      - 'scripts/write-google-services.sh'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install mobile wrapper dependencies
        working-directory: mobile
        run: npm ci
      - name: Sync Capacitor Android project
        working-directory: mobile
        run: npx cap sync android
      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: bash scripts/write-google-services.sh
      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kidemy-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk

  build-release-aab:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # נדרש כדי לפרסם Release בשלב האחרון (ראה ההסבר שם)
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install mobile wrapper dependencies
        working-directory: mobile
        run: npm ci
      - name: Sync Capacitor Android project
        working-directory: mobile
        run: npx cap sync android
      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: bash scripts/write-google-services.sh
      - name: Decode signing keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > mobile/android/app/drushe-release.jks
      - name: Write keystore.properties
        run: |
          cat > mobile/android/app/keystore.properties <<EOF
          storeFile=drushe-release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
      - name: Build signed release AAB
        working-directory: mobile/android
        env:
          # מספר הריצה עולה מונוטונית, ולכן כל AAB מקבל versionCode גבוה מקודמו
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew bundleRelease
      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: drushe-release-aab
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab

      # פרסום נוסף כ-Release, כדי שאפשר יהיה להוריד את ה-AAB עצמו.
      #
      # artifacts של Actions יורדים **תמיד** כ-ZIP — זו התנהגות של הפלטפורמה
      # ואי אפשר לכבות אותה. בנייד זה חוסם בפועל: צריך לחלץ, הקובץ נוחת
      # בתת-תיקייה, ואז בורר הקבצים של אנדרואיד מסתיר סיומת ‎.aab‎ כי אין לה
      # סוג קובץ מוכר — כך שאי אפשר לבחור אותו בהעלאה ל-Play Console.
      # נכס של Release, לעומת זאת, יורד כקובץ עצמו ישירות לתיקיית ההורדות.
      #
      # ⚠️ הריפו ציבורי, ולכן הנכס הזה ציבורי. ה-AAB אינו מכיל את מפתח
      # החתימה (רק חתימה שנוצרה בעזרתו) ואין בו סודות — אבל הוא כן חושף את
      # הגרסה להורדה לפני שהיא בחנות. אושר במפורש על ידי בעל האפליקציה.
      - name: Publish AAB as a downloadable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: build-${{ github.run_number }}
        run: |
          gh release create "$TAG" \
            mobile/android/app/build/outputs/bundle/release/app-release.aab \
            --repo "${{ github.repository }}" \
            --title "AAB · build ${{ github.run_number }}" \
            --notes "AAB חתום לבנייה ${{ github.run_number }} (commit ${{ github.sha }}).
          להורדה ישירה: הקובץ app-release.aab למטה — בלי ZIP ובלי חילוץ.
          versionCode: ${{ github.run_number }}"
