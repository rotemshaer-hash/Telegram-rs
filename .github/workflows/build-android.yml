name: Build Android App

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install mobile wrapper dependencies
        working-directory: mobile
        run: npm ci
      - name: Sync Capacitor Android project
        working-directory: mobile
        run: npx cap sync android
      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kidemy-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk

  build-release-aab:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install mobile wrapper dependencies
        working-directory: mobile
        run: npm ci
      - name: Sync Capacitor Android project
        working-directory: mobile
        run: npx cap sync android
      - name: Decode signing keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > mobile/android/app/drushe-release.jks
      - name: Write keystore.properties
        run: |
          cat > mobile/android/app/keystore.properties <<EOF
          storeFile=drushe-release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
      - name: Build signed release AAB
        working-directory: mobile/android
        run: ./gradlew bundleRelease
      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: drushe-release-aab
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
