name: Deploy to Netlify + Firebase Rules

on:
  push:
    branches:
      - claude/file-processing-app-g5lED
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install CLI tools
        run: npm install -g netlify-cli firebase-tools

      - name: Deploy Firebase Rules
        run: firebase deploy --only database --token "$FIREBASE_TOKEN" --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Deploy to Netlify
        run: netlify deploy --prod --dir=. --site=d7a8591e-3052-4f35-9b69-d2c4633f70c1
        env:
          NETLIFY_AUTH_TOKEN: nfp_tcPKNRrbrJ5ULV63qhYLVxyD3tTqQ4cv18d7
