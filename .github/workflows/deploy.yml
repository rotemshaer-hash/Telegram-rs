name: Deploy to Netlify

on:
  push:
    branches: [main]
    # פריסת ייצור עולה 15 קרדיטים מתוך 3,000 לחודש. בחשבונית של יולי-אוגוסט
    # 194 הפריסות לקחו 2,910 קרדיטים — 97% מהתקציב — בעוד רוחב הפס, הפונקציות
    # והבקשות יחד לקחו פחות משלושה. כלומר התקציב כאן נמדד בפריסות ולא בשימוש,
    # והתקרה היא 200 פריסות בחודש.
    #
    # שום קובץ .md אינו מוגש למשתמשים: הם אינם מקושרים מ-index.html ולא
    # מ-netlify.toml. עדכון של HANDOFF או של החוקה שילם עד היום מחיר מלא של
    # פריסה בלי לשנות דבר באתר החי.
    #
    # אותו נימוק בדיוק חל על `scripts/` ועל `.github/` — כלי CI בלבד. אף אחד
    # מהם אינו נטען מ-index.html ואינו מופיע ב-netlify.toml (רק שתי הערות
    # ב-index.html מזכירות שמות קבצים שם). `publish = "."` אמנם מגיש גם
    # אותם כקבצים סטטיים, בדיוק כמו את קבצי ה-.md, אבל שינוי בהם לא משנה
    # דבר באתר שהמשתמשים מריצים. עד היום כל תיקון בסקריפט גיבוי או
    # ב-workflow שילם 15 קרדיטים על פריסה שלא שינתה כלום.
    #
    # דחיפה שנוגעת גם ב-.md וגם בקוד עדיין נפרסת — GitHub מדלג רק כשכל
    # הקבצים בדחיפה תואמים לרשימה.
    paths-ignore:
      - '**.md'
      - 'scripts/**'
      - '.github/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright OS deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # אותו job כמו ב-test.yml, וכאן הוא השער האמיתי: הוא חוסם את הפריסה
  # לייצור. בלעדיו הדיפלוי נשען על ה-e2e בלבד — ורגרסיה בחוקי האבטחה לא
  # נראית לטסט שרץ מעל ה-JS, כי ה-stub שלו לא מכיר חוקים. זה בדיוק הדפוס
  # שהחזיר את באג המחיקה ארבע פעמים.
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - run: npm ci
      - name: Run security rules tests
        run: npm run test:rules

  deploy:
    needs: [test, rules]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Validate project constitution
        run: bash scripts/validate.sh
      # Netlify אורז כל פונקציה עם התלויות שלה, ולשם כך הוא חייב למצוא אותן
      # ב-node_modules של הריפו. ה-job הזה נפרד מ-job הבדיקות ורץ על מכונה
      # אחרת, כך שה-npm ci ששם לא עוזר כאן. כל עוד לפונקציות לא הייתה אף
      # תלות חיצונית זה לא הפריע — הפונקציה הראשונה שכן משתמשת בתלות שברה
      # את הפריסה עם "Cannot find module".
      # --omit=dev מדלג על Playwright, שנחוץ רק לבדיקות.
      - name: Install function dependencies
        run: npm ci --omit=dev
      # APP_BUILD מוצג למשתמש בתחתית מסך הפתיחה ובפרופיל, ליד מספר הגרסה.
      # הוא היה קבוע שנכתב ביד, ולכן הזדקן בשקט — הוא הצהיר על תאריך בנייה
      # שהיה שבועיים ישן. הטבעה כאן הופכת אותו לנכון תמיד, וזה בדיוק מה
      # שהופך אותו לשימושי: כשמשתמש מדווח שהוא רואה מסך ישן, התאריך שעל
      # המסך שלו אומר מיד אם הוא מריץ עותק מהמטמון.
      - name: Stamp the build date
        run: |
          TODAY=$(date -u +%d-%m-%Y)
          sed -i "s/^const APP_BUILD='[^']*';/const APP_BUILD='$TODAY';/" index.html
          grep -n "const APP_BUILD=" index.html

      # נעוץ בכוונה. ההתקנה הייתה `netlify-cli` בלי גרסה, כלומר כל פריסה
      # לייצור הורידה את הגרסה האחרונה שיצאה באותו רגע. בין הפריסה המוצלחת
      # ב-22.9 לכישלון ב-12.10 יצאו 27.11.0 ו-27.12.0, והפריסה התחילה לדווח
      # כישלון — למרות ש-Netlify פרסם בהצלחה. פריסה לייצור לא צריכה להיות
      # תלויה בשחרור של מישהו אחר.
      - name: Install Netlify CLI
        run: npm install -g netlify-cli@27.12.0
      - name: Unlock production deploys
        run: |
          SITE=$(curl -s "https://api.netlify.com/api/v1/sites/${{ secrets.NETLIFY_SITE_ID }}" \
            -H "Authorization: Bearer ${{ secrets.NETLIFY_AUTH_TOKEN }}")
          LOCKED=$(echo "$SITE" | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          pd=d.get('published_deploy',{})
          print(pd.get('id','') if pd.get('locked') else '')
          ")
          if [ -n "$LOCKED" ]; then
            curl -s -X POST "https://api.netlify.com/api/v1/deploys/$LOCKED/unlock" \
              -H "Authorization: Bearer ${{ secrets.NETLIFY_AUTH_TOKEN }}"
            echo "Unlocked published deploy $LOCKED"
          else
            echo "No locked deploy found"
          fi
      - name: Deploy to Netlify
        id: netlify
        # `|| true` ולא כישלון מיידי — קוד היציאה של ה-CLI אינו העדות הקובעת
        # אם האתר עלה. השלב הבא שואל את Netlify עצמו, וזה מה שמכריע.
        run: |
          set -o pipefail
          netlify deploy --prod --dir=. --site=${{ secrets.NETLIFY_SITE_ID }} && CLI_EXIT=0 || CLI_EXIT=$?
          echo "cli_exit=$CLI_EXIT" >> "$GITHUB_OUTPUT"
          exit 0
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}

      # ── למה יש כאן אימות ולא רק קוד היציאה של ה-CLI ──
      #
      # ב-12.10 הפריסה סומנה אדום פעמיים, בעוד Netlify פרסם את שתיהן בהצלחה
      # והאתר החי היה מעודכן. ה-CLI פרסם ואז יצא עם שגיאה. אדום על פריסה
      # שעבדה הוא לא רק רעש: הוא שוחק את האמון בסימן, וביום שפריסה **באמת**
      # תיכשל איש לא יבחין.
      #
      # המקור הקובע הוא Netlify: הפריסה שפורסמה חייבת להיות על הקומיט הזה
      # ובמצב ready. אם כן — הפריסה הצליחה, גם אם ה-CLI התלונן, וזה מודפס
      # במפורש כדי שלא ייעלם. אם לא — ה-job נכשל, וזה כישלון אמיתי.
      - name: Verify the live site is this commit
        run: |
          SITE=$(curl -sS "https://api.netlify.com/api/v1/sites/${{ secrets.NETLIFY_SITE_ID }}" \
            -H "Authorization: Bearer ${{ secrets.NETLIFY_AUTH_TOKEN }}")
          echo "$SITE" | CLI_EXIT="${{ steps.netlify.outputs.cli_exit }}" SHA="$GITHUB_SHA" python3 -c "
          import json,os,sys
          pd=(json.load(sys.stdin) or {}).get('published_deploy') or {}
          state,ref=pd.get('state'),pd.get('commit_ref')
          sha,cli=os.environ['SHA'],os.environ['CLI_EXIT']
          print(f'published deploy: state={state} commit={ref}')
          if state!='ready' or ref!=sha:
              print(f'::error title=הפריסה לא פורסמה::האתר החי אינו על {sha[:7]} (state={state}, commit={(ref or \"-\")[:7]})')
              sys.exit(1)
          if cli!='0':
              print(f'::warning title=ה-CLI יצא עם {cli} אבל הפריסה פורסמה::האתר החי על {sha[:7]}. בדוק אם netlify-cli צריך עדכון נעיצה.')
          print('✅ האתר החי הוא הקומיט הזה.')
          "
