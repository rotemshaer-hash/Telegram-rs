name: Deploy to Netlify

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Netlify CLI
        run: npm install -g netlify-cli
      - name: Unlock production deploys
        run: |
          LOCKED=$(curl -s "https://api.netlify.com/api/v1/sites/${{ secrets.NETLIFY_SITE_ID }}/deploys?per_page=10" \
            -H "Authorization: Bearer ${{ secrets.NETLIFY_AUTH_TOKEN }}" | \
            python3 -c "import json,sys; d=json.load(sys.stdin); locked=[x for x in d if x.get('locked')]; print(locked[0]['id'] if locked else '')")
          if [ -n "$LOCKED" ]; then
            curl -s -X POST "https://api.netlify.com/api/v1/deploys/$LOCKED/unlock" \
              -H "Authorization: Bearer ${{ secrets.NETLIFY_AUTH_TOKEN }}"
            echo "Unlocked deploy $LOCKED"
          fi
      - name: Deploy to Netlify
        run: netlify deploy --prod --dir=. --site=${{ secrets.NETLIFY_SITE_ID }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
