name: Test

# Runs the E2E smoke suite on feature branches / PRs, so a broken change is
# visible before it's ever merged to main — not just at deploy time (main's
# push already gets the same suite as a gate inside deploy.yml).
on:
  push:
    branches-ignore: [main]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
