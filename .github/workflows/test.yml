name: Test

# Runs the E2E smoke suite on feature branches / PRs, so a broken change is
# visible before it's ever merged to main — not just at deploy time (main's
# push already gets the same suite as a gate inside deploy.yml).
on:
  push:
    branches-ignore: [main]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: |
          # ההתקנה מושכת חבילות apt, ו-DNS של מראות אובונטו על הראנר נופל מדי פעם
          # ("Temporary failure resolving 'archive.ubuntu.com'") — זה הפיל ריצה ב-11.11.2026
          # על קוד שעבר. שלושה ניסיונות עם המתנה, ואז כישלון אמיתי.
          for i in 1 2 3; do
            npx playwright install --with-deps chromium && exit 0
            echo "ניסיון $i נכשל — ממתין ומנסה שוב"
            sleep $((i * 20))
          done
          exit 1
      - name: Install Playwright OS deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: |
          for i in 1 2 3; do
            npx playwright install-deps chromium && exit 0
            echo "ניסיון $i נכשל — ממתין ומנסה שוב"
            sleep $((i * 20))
          done
          exit 1
      - run: npm test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # חוקי האבטחה נבדקים מול האמולטור עם הקובץ האמיתי.
  #
  # למה זה job נפרד ולא עוד טסט: באג המחיקה חזר ארבע פעמים כי הקוד קרא צמתים
  # שהחוקים לא מרשים לקרוא — הבקשה נדחתה, ה-catch בלע, והמחיקה "הצליחה".
  # טסט מעל ה-JS לא יכול לראות את זה: ה-stub שלו לא מכיר חוקים. רק הרצה מול
  # מנוע החוקים האמיתי כן.
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      # אמולטור ה-Database הוא תהליך Java
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - run: npm ci
      - name: Run security rules tests
        run: npm run test:rules
