name: Build iOS App (simulator, unsigned)

# Builds for the iOS Simulator only — this needs no Apple Developer account or
# signing certificates, and just proves the Xcode project compiles. A real
# device / App Store build additionally needs a paid Apple Developer account,
# a signing certificate, and a provisioning profile, none of which exist yet —
# see mobile/README.md for what that step will involve.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-ios.yml'

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install mobile wrapper dependencies
        working-directory: mobile
        run: npm ci

      # אריזת האתר לתוך האפליקציה, ל-iOS בלבד.
      #
      # capacitor.config.json מגדיר server.url, כלומר האפליקציה פותחת את האתר
      # החי ב-WebView. באנדרואיד זה נשאר בכוונה — זה מה שמאפשר לתיקון להגיע
      # למכשיר בלי בנייה ופרסום חדשים, וזו שיטת העבודה בפועל.
      #
      # אפל דוחה את זה תחת Guideline 4.2: אפליקציה שהיא בעיקר מעטפת לאתר אינה
      # עומדת בדרישת הפונקציונליות המינימלית, וזו סיבת הדחייה הנפוצה ביותר.
      #
      # ההסרה נעשית כאן ולא בקובץ עצמו, כי היא נכונה ל-iOS בלבד. שינוי הקובץ
      # היה מבטל את העדכונים החיים גם באנדרואיד — מחיר גבוה לפתרון בעיה של
      # פלטפורמה אחרת.
      - name: Bundle the site into the app (iOS only)
        run: bash scripts/build-mobile-www.sh

      - name: Remove server.url so iOS serves the bundled copy
        working-directory: mobile
        run: |
          node -e "
            const fs=require('fs'), p='capacitor.config.json';
            const c=JSON.parse(fs.readFileSync(p,'utf8'));
            delete c.server;
            fs.writeFileSync(p, JSON.stringify(c,null,2));
            console.log('server.url הוסר — האפליקציה תגיש את העותק הארוז');
          "

      - name: Sync Capacitor iOS project
        working-directory: mobile
        run: npx cap sync ios
      - name: Build for iOS Simulator (unsigned)
        working-directory: mobile/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App \
            -sdk iphonesimulator -configuration Debug \
            CODE_SIGNING_ALLOWED=NO build
