name: Storage Scan

# סריקת קבצים יתומים ב-Firebase Storage. **קריאה בלבד** — אין לסקריפט הזה
# מצב מחיקה ואין לו קלט, בדיוק כמו orphan-scan.js. הוא רץ על הייצור כי
# ל-staging אין דלי משלו (ראה scripts/lib/admin.js), ולכן אין מה לבחור.
on:
  schedule:
    # ראשון ב-04:40 UTC (~07:40 בישראל). שבועי ולא יומי: קבצים יתומים נוצרים
    # רק כשמשתמש נמחק, וזה אירוע נדיר — סריקה יומית הייתה רעש.
    # השעה נבחרה כדי לא להתנגש: הגיבוי ב-01:00 וה-health-monitor ב-06:00.
    # דקה שאינה 0 במכוון — רוב ה-workflows בעולם מתוזמנים לשעה עגולה, והתור
    # של GitHub דוחה אותם בדקות.
    - cron: '40 4 * * 0'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: scripts
        run: npm install

      - name: Run storage scan
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node storage-scan.js
