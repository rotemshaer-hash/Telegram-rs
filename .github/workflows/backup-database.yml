name: Backup Database

on:
  workflow_dispatch:
  schedule:
    # כל יום ב-01:00 UTC (~04:00 בישראל) — השעה השקטה ביותר, כדי שהגיבוי
    # יתפוס מצב יציב ולא אמצע פעילות.
    - cron: '0 1 * * *'

jobs:
  backup:
    runs-on: ubuntu-latest
    # אותה רשת ביטחון כמו בדוח השבועי: ברירת המחדל של GitHub היא שש שעות,
    # וסקריפט שמחזיק סוקט RTDB פתוח שורף אותן בשקט. עשר דקות הן פי כמה
    # ממשך ריצה סביר, וכישלון בגלל timeout פותח Issue כמו כל כישלון אחר.
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: scripts
        run: npm install
      - name: Back up the database
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node backup-database.js

      # גיבוי שנכשל בשקט גרוע מאין גיבוי: הוא נותן ביטחון שאין לו כיסוי.
      # הדוח השבועי נכשל כאן חמישה שבועות ברצף בלי שאיש ידע, ולכן כל ריצה
      # מתוזמנת בפרויקט הזה פותחת Issue כשהיא נופלת.
      - name: Open an issue if the backup failed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = '🚨 הגיבוי היומי של מסד הנתונים נכשל';
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'הריצה המתוזמנת של **Backup Database** נכשלה, כלומר',
              '**אין גיבוי מהיום**.',
              '',
              `לוג הריצה: ${url}`,
              '',
              'סיבות אפשריות, לפי סדר הסבירות:',
              '- לחשבון השירות אין הרשאת כתיבה לדלי ה-Storage.',
              '- שם הדלי שונה מברירת המחדל — אפשר לעקוף עם המשתנה',
              '  `FIREBASE_STORAGE_BUCKET`.',
              '- הסוד `FIREBASE_SERVICE_ACCOUNT` חסר או פגום.',
              '',
              'הלוג אומר בדיוק איזו מהן.',
              '',
              '_נפתח אוטומטית. סגור אותו אחרי שהריצה הבאה מצליחה._',
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'database-backup',
            });
            if (existing.data.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['database-backup'],
              });
            }
